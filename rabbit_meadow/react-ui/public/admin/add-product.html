<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إضافة منتج جديد</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Almarai:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link href="/admin/admin.css" rel="stylesheet" />
  </head>
  <body>
    <section class="admin-shell admin-compact">
      <header class="admin-header">
        <button class="icon-btn" data-route="/admin/dashboard" title="رجوع">
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
        <div class="header-group">
          <div>
            <h1 id="product-page-title" class="page-title">إضافة منتج جديد</h1>
          </div>
        </div>
        <img
          class="avatar"
          src="https://images.unsplash.com/photo-1521119989659-a83eee488004?auto=format&fit=crop&w=120&q=80"
          alt="admin"
        />
      </header>

      <main class="container stack">
        <section class="hero">
          <h2>إضافة محصول جديد</h2>
          <p>قم بتوسيع سلة الأرنب بمنتجات عضوية طازجة من مزارعنا المحلية.</p>
        </section>

        <section class="card stack">
          <div class="row">
            <span class="material-symbols-outlined" style="color: #67bde2">info</span>
            <h3 class="stock-section-title">المعلومات الأساسية</h3>
          </div>

          <label>
            <div class="label">اسم المنتج</div>
            <input id="product-name-ar" class="input-field" type="text" placeholder="مثال: جزر عضوي طازج" />
          </label>

          <label>
            <div class="label">وصف المنتج</div>
            <textarea id="product-description" class="textarea-field" placeholder="اكتب تفاصيل المنتج، المصدر، والفوائد..."></textarea>
          </label>
        </section>

        <section class="card stack">
          <div class="row">
            <span class="material-symbols-outlined" style="color: #67bde2">payments</span>
            <h3 class="stock-section-title">السعر</h3>
          </div>

          <label>
            <div class="label">عملة إدخال السعر</div>
            <select id="product-input-currency" class="select-field">
              <option value="SYP">ليرة سورية (SYP)</option>
              <option value="USD">دولار أمريكي (USD)</option>
            </select>
          </label>

          <label>
            <div id="product-cost-price-label" class="label">سعر رأس المال (SYP)</div>
            <input id="product-cost-price" class="input-field" type="number" min="0" step="0.01" placeholder="0.00" />
            <div id="product-cost-price-converted" class="tiny muted mt-8">≈ 0</div>
          </label>

          <label>
            <div id="product-sell-price-label" class="label">السعر (SYP)</div>
            <input id="product-sell-price" class="input-field" type="number" min="0" step="0.01" placeholder="0.00" />
            <div id="product-sell-price-converted" class="tiny muted mt-8">≈ 0</div>
          </label>

          <div id="product-exchange-rate-label" class="tiny muted">سعر الصرف الحالي: 1 USD = 0</div>

          <div class="grid-2">
            <label>
              <div class="label">الوحدة</div>
              <select id="product-unit" class="select-field">
                <option>كيلوجرام (kg)</option>
                <option>حبة (piece)</option>
                <option>ربطة</option>
              </select>
            </label>
            <label>
              <div class="label">التصنيف</div>
              <select id="product-category-id" class="select-field">
                <option value="">اختر التصنيف...</option>
              </select>
            </label>
          </div>

          <label class="new-product-toggle">
            <div class="label">إعداد العرض</div>
            <div class="new-product-toggle-box">
              <input id="product-is-new" type="checkbox" />
              <span>عرض المنتج ضمن قسم المنتجات الجديدة</span>
            </div>
          </label>
        </section>

        <section class="card stack">
          <div class="row">
            <span class="material-symbols-outlined" style="color: #67bde2">image</span>
            <h3 class="stock-section-title">صورة المنتج</h3>
          </div>

          <input id="product-image-file" type="file" accept="image/*" hidden />
          <button id="product-image-picker" class="media-box media-box-button" type="button">
            <div>
              <div class="media-icon">
                <span class="material-symbols-outlined">cloud_upload</span>
              </div>
              <strong class="stock-media-title">اسحب الصورة هنا أو اضغط للرفع</strong>
              <p class="muted small">PNG أو JPG، حجم أقصى 5 ميجابايت</p>
            </div>
          </button>
          <img id="product-image-preview" class="media-preview" alt="صورة المنتج" hidden />
          <div id="product-image-feedback" class="tiny muted upload-status">لم يتم رفع صورة بعد.</div>
        </section>

        <button class="ghost" data-route="/admin/dashboard">إلغاء التغييرات</button>
        <button id="save-product-btn" class="cta" type="button">
          <span class="material-symbols-outlined" style="vertical-align: middle">check_circle</span>
          حفظ المنتج
        </button>
      </main>
    </section>

    <script src="/admin/admin-bridge.js"></script>
    <script>
      (function () {
        if (!window.AdminBridge) return;

        var categorySelect = document.getElementById('product-category-id');
        var saveButton = document.getElementById('save-product-btn');
        var pageTitle = document.getElementById('product-page-title');
        var imageInput = document.getElementById('product-image-file');
        var imagePicker = document.getElementById('product-image-picker');
        var imagePreview = document.getElementById('product-image-preview');
        var imageFeedback = document.getElementById('product-image-feedback');
        var costPriceInput = document.getElementById('product-cost-price');
        var sellPriceInput = document.getElementById('product-sell-price');
        var inputCurrencySelect = document.getElementById('product-input-currency');
        var costPriceLabel = document.getElementById('product-cost-price-label');
        var sellPriceLabel = document.getElementById('product-sell-price-label');
        var costPriceConverted = document.getElementById('product-cost-price-converted');
        var sellPriceConverted = document.getElementById('product-sell-price-converted');
        var exchangeRateLabel = document.getElementById('product-exchange-rate-label');

        if (!categorySelect || !saveButton) return;

        var uploadedImageUrl = '';
        var isUploading = false;
        var storeCurrency = 'SYP';
        var usdSarRate = 15000;
        var editingProductId = '';
        var editingStockQty = 0;
        var editingMinStock = 0;
        var previousInputCurrency = 'SYP';

        function makeProductId(name) {
          var base = String(name || '')
            .trim()
            .toLowerCase()
            .replace(/\s+/g, '-')
            .replace(/[^a-z0-9-]/g, '')
            .replace(/-+/g, '-')
            .replace(/^-|-$/g, '');

          if (!base) {
            base = 'product-' + Date.now();
          }

          return base.slice(0, 50);
        }

        function unitValue(label) {
          if ((label || '').indexOf('piece') !== -1 || (label || '').indexOf('حبة') !== -1) {
            return 'PIECE';
          }

          if ((label || '').indexOf('ربطة') !== -1 || (label || '').indexOf('bundle') !== -1) {
            return 'BUNDLE';
          }

          return 'KG';
        }

        function setImageFeedback(message, isError) {
          if (!imageFeedback) return;
          imageFeedback.textContent = message || '';
          imageFeedback.classList.toggle('is-error', Boolean(isError));
          imageFeedback.classList.toggle('is-success', Boolean(message) && !isError);
        }

        function formatNumber(value) {
          var number = Number(value || 0);
          return number.toLocaleString('ar-SA', { maximumFractionDigits: 2 });
        }

        function currencyLabel(currency) {
          if (currency === 'SAR') return 'ر.س';
          if (currency === 'SYP') return 'ل.س';
          return currency || '';
        }

        function formatMoney(value, currency) {
          return formatNumber(value) + ' ' + currencyLabel(currency);
        }

        function inputCurrency() {
          return String((inputCurrencySelect && inputCurrencySelect.value) || 'SYP').toUpperCase();
        }

        function parsePriceInput(node) {
          return Number((node && node.value) || 0);
        }

        function toLocalPrice(rawValue, currency) {
          var amount = Number(rawValue);
          var code = String(currency || 'SYP').toUpperCase();
          if (!Number.isFinite(amount) || amount <= 0) return 0;
          if (code === 'USD') {
            return amount * Math.max(1, Number(usdSarRate) || 1);
          }
          return amount;
        }

        function fromLocalPrice(localValue, currency) {
          var amount = Number(localValue);
          var code = String(currency || 'SYP').toUpperCase();
          if (!Number.isFinite(amount) || amount <= 0) return 0;
          if (code === 'USD') {
            var rate = Math.max(1, Number(usdSarRate) || 1);
            return amount / rate;
          }
          return amount;
        }

        function formatEditable(value) {
          var numeric = Number(value || 0);
          if (!Number.isFinite(numeric)) return '0';
          return (Math.round(numeric * 100) / 100).toString();
        }

        function updatePriceLabels() {
          var code = inputCurrency();
          if (costPriceLabel) {
            costPriceLabel.textContent = 'سعر رأس المال (' + code + ')';
          }
          if (sellPriceLabel) {
            sellPriceLabel.textContent = 'سعر المبيع (' + code + ')';
          }
        }

        function renderExchangeRateText() {
          if (!exchangeRateLabel) return;
          exchangeRateLabel.textContent =
            'سعر الصرف الحالي: 1 USD = ' + formatMoney(usdSarRate, storeCurrency);
        }

        function updateConvertedPrices() {
          var code = inputCurrency();
          var costRaw = parsePriceInput(costPriceInput);
          var sellRaw = parsePriceInput(sellPriceInput);
          var costLocal = toLocalPrice(costRaw, code);
          var sellLocal = toLocalPrice(sellRaw, code);

          if (costPriceConverted) {
            costPriceConverted.textContent =
              code === 'USD'
                ? 'بالسوري: ' + formatMoney(costLocal, storeCurrency)
                : 'بالسوري مباشرة: ' + formatMoney(costLocal, storeCurrency);
          }

          if (sellPriceConverted) {
            sellPriceConverted.textContent =
              code === 'USD'
                ? 'بالسوري: ' + formatMoney(sellLocal, storeCurrency)
                : 'بالسوري مباشرة: ' + formatMoney(sellLocal, storeCurrency);
          }
        }

        function swapInputCurrency(nextCurrency) {
          var nextCode = String(nextCurrency || 'SYP').toUpperCase();
          var previousCode = previousInputCurrency;
          if (nextCode === previousCode) return;

          var currentCostRaw = parsePriceInput(costPriceInput);
          var currentSellRaw = parsePriceInput(sellPriceInput);
          var localCost = toLocalPrice(currentCostRaw, previousCode);
          var localSell = toLocalPrice(currentSellRaw, previousCode);
          var nextCostRaw = fromLocalPrice(localCost, nextCode);
          var nextSellRaw = fromLocalPrice(localSell, nextCode);

          if (costPriceInput) {
            costPriceInput.value = formatEditable(nextCostRaw);
          }
          if (sellPriceInput) {
            sellPriceInput.value = formatEditable(nextSellRaw);
          }

          previousInputCurrency = nextCode;
          updatePriceLabels();
          updateConvertedPrices();
        }

        function applyEditingProduct(product) {
          if (!product || typeof product !== 'object') return;
          editingProductId = String(product.id || '').trim();
          if (!editingProductId) return;

          editingStockQty = Math.max(0, Number(product.stockQty || 0) || 0);
          editingMinStock = Math.max(0, Number(product.minStock || 0) || 0);

          var nameInput = document.getElementById('product-name-ar');
          var descriptionInput = document.getElementById('product-description');
          var unitSelect = document.getElementById('product-unit');
          var isNewInput = document.getElementById('product-is-new');

          if (pageTitle) {
            pageTitle.textContent = 'تعديل المنتج';
          }

          if (saveButton) {
            saveButton.innerHTML =
              '<span class="material-symbols-outlined" style="vertical-align: middle">edit</span> حفظ التعديل';
          }

          if (nameInput) {
            nameInput.value = String(product.nameAr || '');
          }
          if (descriptionInput) {
            descriptionInput.value = String(product.description || '');
          }
          if (categorySelect) {
            categorySelect.value = String(product.categoryId || '');
          }
          if (unitSelect) {
            var unitCode = String(product.unit || 'KG').toUpperCase();
            if (unitCode === 'PIECE') {
              unitSelect.value = 'حبة (piece)';
            } else if (unitCode === 'BUNDLE') {
              unitSelect.value = 'ربطة';
            } else {
              unitSelect.value = 'كيلوجرام (kg)';
            }
          }
          if (isNewInput) {
            isNewInput.checked = Boolean(product.isNew);
          }

          var localCost = Math.max(0, Number(product.costPrice || 0) || 0);
          var localSell = Math.max(0, Number(product.sellPrice || 0) || 0);
          var code = inputCurrency();
          if (costPriceInput) {
            costPriceInput.value = formatEditable(fromLocalPrice(localCost, code));
          }
          if (sellPriceInput) {
            sellPriceInput.value = formatEditable(fromLocalPrice(localSell, code));
          }

          uploadedImageUrl = product.imageUrl ? String(product.imageUrl) : '';
          if (imagePreview) {
            imagePreview.src = uploadedImageUrl;
            imagePreview.hidden = !uploadedImageUrl;
          }
          setImageFeedback(
            uploadedImageUrl ? 'الصورة الحالية مفعلة. يمكنك رفع صورة جديدة للتغيير.' : 'لم يتم رفع صورة بعد.',
            false,
          );

          updatePriceLabels();
          updateConvertedPrices();
        }

        async function loadEditingProductIfNeeded() {
          var params = new URLSearchParams(window.location.search || '');
          var editId = String(params.get('editId') || '').trim();
          if (!editId) return;

          try {
            var products = await window.AdminBridge.apiRequest('/admin/products');
            var product = (Array.isArray(products) ? products : []).find(function (item) {
              return String(item && item.id ? item.id : '') === editId;
            });

            if (!product) {
              alert('المنتج المطلوب للتعديل غير موجود.');
              return;
            }

            applyEditingProduct(product);
          } catch (_error) {
            alert('تعذر تحميل بيانات المنتج للتعديل.');
          }
        }

        async function uploadToCloudinary(file) {
          if (!file) return;

          if (!file.type || file.type.indexOf('image/') !== 0) {
            setImageFeedback('الملف يجب أن يكون صورة.', true);
            return;
          }

          if (file.size > 5 * 1024 * 1024) {
            setImageFeedback('حجم الصورة أكبر من 5 ميجابايت.', true);
            return;
          }

          isUploading = true;
          setImageFeedback('جاري رفع الصورة...', false);
          if (imagePicker) imagePicker.disabled = true;

          try {
            var sign = await window.AdminBridge.apiRequest('/admin/uploads/cloudinary-signature');
            var formData = new FormData();
            formData.append('file', file);
            formData.append('api_key', String(sign.apiKey || ''));
            formData.append('timestamp', String(sign.timestamp || ''));
            formData.append('signature', String(sign.signature || ''));
            formData.append('folder', String(sign.folder || 'al-arnab'));

            var response = await fetch(String(sign.uploadUrl || ''), {
              method: 'POST',
              body: formData,
            });

            var data = null;
            try {
              data = await response.json();
            } catch (error) {
              data = null;
            }

            if (!response.ok) {
              var cloudError =
                (data && data.error && data.error.message) ||
                'تعذر رفع الصورة إلى Cloudinary.';
              throw new Error(cloudError);
            }

            uploadedImageUrl = data && (data.secure_url || data.url) ? String(data.secure_url || data.url) : '';
            if (!uploadedImageUrl) {
              throw new Error('لم يتم استلام رابط الصورة بعد الرفع.');
            }

            if (imagePreview) {
              imagePreview.src = uploadedImageUrl;
              imagePreview.hidden = false;
            }

            setImageFeedback('تم رفع الصورة بنجاح.', false);
          } catch (error) {
            uploadedImageUrl = '';
            if (imagePreview) {
              imagePreview.src = '';
              imagePreview.hidden = true;
            }
            setImageFeedback((error && error.message) || 'تعذر رفع الصورة.', true);
          } finally {
            isUploading = false;
            if (imagePicker) imagePicker.disabled = false;
          }
        }

        async function loadCategories() {
          try {
            var categories = await window.AdminBridge.apiRequest('/admin/categories');
            categorySelect.innerHTML = '<option value="">اختر التصنيف...</option>';

            (categories || []).forEach(function (category) {
              var option = document.createElement('option');
              option.value = category.id;
              option.textContent = category.nameAr;
              categorySelect.appendChild(option);
            });
          } catch (error) {
            categorySelect.innerHTML = '<option value="">تعذر تحميل التصنيفات</option>';
          }
        }

        async function loadStoreSettings() {
          renderExchangeRateText();
          updateConvertedPrices();

          try {
            var settings = await window.AdminBridge.apiRequest('/admin/settings/store');
            var nextRate = Number(settings && settings.usdSarRate ? settings.usdSarRate : 0);
            if (Number.isFinite(nextRate) && nextRate > 0) {
              usdSarRate = nextRate;
            }

            storeCurrency = (settings && settings.currency ? String(settings.currency) : storeCurrency) || 'SYP';
          } catch (error) {
            // Use fallback local values when settings request fails.
          }

          renderExchangeRateText();
          updateConvertedPrices();
        }

        if (imagePicker && imageInput) {
          imagePicker.addEventListener('click', function () {
            imageInput.click();
          });

          imageInput.addEventListener('change', function () {
            var file = imageInput.files && imageInput.files[0] ? imageInput.files[0] : null;
            uploadToCloudinary(file);
          });
        }

        if (costPriceInput) {
          costPriceInput.addEventListener('input', updateConvertedPrices);
        }

        if (sellPriceInput) {
          sellPriceInput.addEventListener('input', updateConvertedPrices);
        }

        if (inputCurrencySelect) {
          inputCurrencySelect.addEventListener('change', function () {
            swapInputCurrency(inputCurrencySelect.value);
          });
        }

        saveButton.addEventListener('click', async function () {
          var nameAr = (document.getElementById('product-name-ar') || {}).value || '';
          var description = (document.getElementById('product-description') || {}).value || '';
          var rawCostPrice = parsePriceInput(costPriceInput);
          var rawSellPrice = parsePriceInput(sellPriceInput);
          var categoryId = categorySelect.value || '';
          var unitLabel = ((document.getElementById('product-unit') || {}).value || '').trim();
          var isNew = Boolean((document.getElementById('product-is-new') || {}).checked);
          var currencyCode = inputCurrency();
          var costPrice = toLocalPrice(rawCostPrice, currencyCode);
          var sellPrice = toLocalPrice(rawSellPrice, currencyCode);

          if (!nameAr.trim()) {
            alert('اسم المنتج مطلوب.');
            return;
          }

          if (!categoryId) {
            alert('اختر التصنيف أولاً.');
            return;
          }

          if (isUploading) {
            alert('انتظر حتى انتهاء رفع الصورة.');
            return;
          }

          saveButton.disabled = true;
          var originalLabel = saveButton.textContent;
          saveButton.textContent = 'جاري الحفظ...';

          try {
            await window.AdminBridge.apiRequest('/admin/products', {
              method: 'POST',
              body: {
                id: editingProductId || makeProductId(nameAr),
                categoryId: categoryId,
                nameAr: nameAr.trim(),
                description: description.trim() || undefined,
                costPrice: Number.isFinite(costPrice) ? Math.max(0, costPrice) : 0,
                sellPrice: Number.isFinite(sellPrice) ? Math.max(0, sellPrice) : 0,
                stockQty: editingProductId ? editingStockQty : 0,
                minStock: editingProductId ? editingMinStock : 0,
                unit: unitValue(unitLabel),
                isNew: isNew,
                imageUrl: uploadedImageUrl || undefined,
              },
            });

            window.AdminBridge.go('/admin/dashboard');
          } catch (error) {
            alert((error && error.message) || 'تعذر حفظ المنتج. تأكد من تسجيل الدخول كأدمن.');
            saveButton.disabled = false;
            saveButton.textContent = originalLabel;
          }
        });

        updatePriceLabels();
        previousInputCurrency = inputCurrency();
        Promise.all([loadCategories(), loadStoreSettings()]).then(function () {
          loadEditingProductIfNeeded();
        });
      })();
    </script>
  </body>
</html>
