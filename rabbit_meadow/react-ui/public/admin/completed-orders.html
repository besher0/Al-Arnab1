<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الطلبات المكتملة</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Almarai:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link href="/admin/admin.css" rel="stylesheet" />
  </head>
  <body>
    <section class="admin-shell admin-compact">
      <header class="admin-header">
        <button class="icon-btn" data-route="/admin/orders/current" title="رجوع">
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
        <div class="header-group">
          <div>
            <h1 class="page-title">الطلبات المكتملة</h1>
            <p class="page-subtitle">Al-Arnab</p>
          </div>
        </div>
        <img
          class="avatar"
          src="https://images.unsplash.com/photo-1521119989659-a83eee488004?auto=format&fit=crop&w=120&q=80"
          alt="admin"
        />
      </header>

      <main class="container stack">
        <p class="section-caption">كل الطلبات التي تم تسليمها بنجاح.</p>

        <section id="completed-orders-list" class="stack">
          <article class="card orders-empty">جاري تحميل الطلبات...</article>
        </section>
      </main>

      <nav class="bottom-nav">
        <button class="nav-item" data-route="/admin/dashboard">
          <span class="material-symbols-outlined nav-icon">home</span>
          Home
        </button>
        <button class="nav-item" data-route="/admin/categories/new">
          <span class="material-symbols-outlined nav-icon">category</span>
          Categories
        </button>
        <button class="nav-item active" data-route="/admin/orders/completed">
          <span class="material-symbols-outlined nav-icon">receipt_long</span>
          Orders
        </button>
        <button class="nav-item" data-route="/admin/dashboard">
          <span class="material-symbols-outlined nav-icon">person</span>
          Profile
        </button>
      </nav>
    </section>

    <script src="/admin/admin-bridge.js"></script>
    <script>
      (function () {
        if (!window.AdminBridge || typeof window.AdminBridge.apiRequest !== 'function') {
          return;
        }

        var listElement = document.getElementById('completed-orders-list');

        function escapeHtml(value) {
          return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function formatMoney(value) {
          return Number(value || 0).toLocaleString('ar-SA', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          }) + ' ر.س';
        }

        function formatDate(value) {
          var date = new Date(value);
          if (Number.isNaN(date.getTime())) return '-';
          return date.toLocaleString('ar-SA', {
            year: 'numeric',
            month: 'long',
            day: '2-digit',
          });
        }

        function renderOrders(orders) {
          if (!listElement) return;

          if (!Array.isArray(orders) || orders.length === 0) {
            listElement.innerHTML = '<article class="card orders-empty">لا توجد طلبات مكتملة حالياً.</article>';
            return;
          }

          listElement.innerHTML = orders
            .map(function (order) {
              var route = '/admin/orders/detail?id=' + encodeURIComponent(order.id || '');

              return [
                '<article class="card stack">',
                '  <div class="row">',
                '    <span class="tag success">تم التوصيل</span>',
                '    <strong class="orders-customer">طلب #' + escapeHtml(order.orderNumber || '-') + '</strong>',
                '  </div>',
                '  <div class="grid-2">',
                '    <article class="soft-card text-center">',
                '      <div class="muted tiny">إجمالي المبلغ</div>',
                '      <div class="price-sm">' + escapeHtml(formatMoney(order.total)) + '</div>',
                '    </article>',
                '    <article class="soft-card text-center">',
                '      <div class="muted tiny">تاريخ التسليم</div>',
                '      <strong>' + escapeHtml(formatDate(order.createdAt)) + '</strong>',
                '    </article>',
                '  </div>',
                '  <div class="row">',
                '    <span class="muted">' + escapeHtml(order.customer && order.customer.name ? order.customer.name : '-') + '</span>',
                '    <span class="muted tiny">' + escapeHtml(order.customer && order.customer.phone ? order.customer.phone : '-') + '</span>',
                '  </div>',
                '  <button class="cta" data-route="' + escapeHtml(route) + '">عرض التفاصيل</button>',
                '</article>',
              ].join('');
            })
            .join('');

          window.AdminBridge.bindRoutes(listElement);
        }

        async function loadCompletedOrders() {
          if (!listElement) return;
          listElement.innerHTML = '<article class="card orders-empty">جاري تحميل الطلبات...</article>';

          try {
            var response = await window.AdminBridge.apiRequest('/admin/orders/completed');
            renderOrders(Array.isArray(response) ? response : []);
          } catch (error) {
            listElement.innerHTML =
              '<article class="card orders-empty">تعذر تحميل الطلبات المكتملة. تأكد من تسجيل الدخول بحساب أدمن.</article>';
          }
        }

        loadCompletedOrders();
      })();
    </script>
  </body>
</html>
