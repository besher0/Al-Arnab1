<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>طلباتي الجارية</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Almarai:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link href="/admin/admin.css" rel="stylesheet" />
  </head>
  <body>
    <section class="admin-shell admin-compact">
      <header class="admin-header">
        <button class="icon-btn" data-route="/admin/dashboard" title="رجوع">
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
        <div class="header-group">
          <div>
            <h1 class="page-title">طلباتي الجارية</h1>
            <p class="page-subtitle">Al-Arnab</p>
          </div>
        </div>
        <img
          class="avatar"
          src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=120&q=80"
          alt="admin"
        />
      </header>

      <main class="container stack">
        <section class="row orders-filter-row" data-filter-group>
          <button class="pill active" data-filter="NEW">جديد (0)</button>
          <button class="pill" data-filter="PREPARING">جاري التجهيز (0)</button>
          <button class="pill" data-filter="ON_THE_WAY">في الطريق (0)</button>
        </section>

        <section id="current-orders-list" class="stack">
          <article class="card orders-empty">جاري تحميل الطلبات...</article>
        </section>
      </main>

      <nav class="bottom-nav five">
        <button class="nav-item" data-route="/admin/dashboard">
          <span class="material-symbols-outlined nav-icon">settings</span>
          Settings
        </button>
        <button class="nav-item" data-route="/admin/orders/completed">
          <span class="material-symbols-outlined nav-icon">history</span>
          History
        </button>
        <button class="nav-item" data-route="/admin/reports/sales">
          <span class="material-symbols-outlined nav-icon">place</span>
          Map
        </button>
        <button class="nav-item active" data-route="/admin/orders/current">
          <span class="material-symbols-outlined nav-icon">shopping_bag</span>
          Orders
        </button>
        <button class="nav-item" data-route="/admin/dashboard">
          <span class="material-symbols-outlined nav-icon">home</span>
          Home
        </button>
      </nav>
    </section>

    <script src="/admin/admin-bridge.js"></script>
    <script>
      (function () {
        if (!window.AdminBridge || typeof window.AdminBridge.apiRequest !== 'function') {
          return;
        }

        var listElement = document.getElementById('current-orders-list');
        var filterButtons = Array.prototype.slice.call(document.querySelectorAll('[data-filter]'));
        var orders = [];
        var activeFilter = 'NEW';
        var ordersPollingTimer = null;
        var ordersPollingInFlight = false;
        var initialOrdersLoaded = false;
        var previousActiveOrderIds = {};
        var adminAudioContext = null;
        var adminAudioUnlocked = false;

        var STATUS_LABELS = {
          NEW: 'جديد',
          PREPARING: 'جاري التجهيز',
          ON_THE_WAY: 'في الطريق',
          DELIVERED: 'تم التوصيل',
          REJECTED: 'مرفوض',
          CANCELLED: 'ملغي',
        };
        var WHATSAPP_ICON_SVG =
          '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-whatsapp" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/></svg>';

        function escapeHtml(value) {
          return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function numberLabel(value) {
          return Number(value || 0).toLocaleString('ar-SA');
        }

        function formatMoney(value) {
          return Number(value || 0).toLocaleString('ar-SA', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          }) + ' ر.س';
        }

        function formatDateTime(value) {
          var date = new Date(value);
          if (Number.isNaN(date.getTime())) return '-';

          return date.toLocaleString('ar-SA', {
            day: '2-digit',
            month: 'short',
            hour: '2-digit',
            minute: '2-digit',
          });
        }

        function statusLabel(status) {
          return STATUS_LABELS[status] || 'غير محدد';
        }

        function statusClass(status) {
          if (status === 'PREPARING' || status === 'ON_THE_WAY') return 'success';
          if (status === 'NEW') return 'warning';
          return 'danger';
        }

        function digitsOnly(value) {
          return String(value || '').replace(/[^+\d]/g, '');
        }

        function whatsappDigits(value) {
          var digits = String(value || '').replace(/[^\d]/g, '');
          if (digits.indexOf('00') === 0) {
            return digits.slice(2);
          }
          return digits;
        }

        function getAudioContext() {
          if (adminAudioContext) return adminAudioContext;
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          try {
            adminAudioContext = new AudioCtx();
            return adminAudioContext;
          } catch (_error) {
            return null;
          }
        }

        function unlockAdminAudio() {
          var context = getAudioContext();
          if (!context) return;
          if (context.state === 'suspended') {
            context.resume().catch(function () {
              // ignore unlock errors
            });
          }
          adminAudioUnlocked = true;
        }

        function bindAdminAudioUnlock() {
          var unlockOnce = function () {
            unlockAdminAudio();
            window.removeEventListener('pointerdown', unlockOnce, true);
            window.removeEventListener('touchstart', unlockOnce, true);
            window.removeEventListener('keydown', unlockOnce, true);
          };

          window.addEventListener('pointerdown', unlockOnce, true);
          window.addEventListener('touchstart', unlockOnce, true);
          window.addEventListener('keydown', unlockOnce, true);
        }

        function playTone(context, frequency, startTime, duration, gainValue) {
          var oscillator = context.createOscillator();
          var gain = context.createGain();
          oscillator.type = 'triangle';
          oscillator.frequency.setValueAtTime(frequency, startTime);
          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.exponentialRampToValueAtTime(gainValue, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
          oscillator.connect(gain);
          gain.connect(context.destination);
          oscillator.start(startTime);
          oscillator.stop(startTime + duration + 0.02);
        }

        function playNewOrderSound() {
          var context = getAudioContext();
          if (!context) return;
          if (context.state === 'suspended' && !adminAudioUnlocked) return;
          if (context.state === 'suspended') {
            context.resume().catch(function () {
              // ignore resume failures
            });
          }

          var now = context.currentTime + 0.01;
          playTone(context, 740, now, 0.12, 0.13);
          playTone(context, 988, now + 0.17, 0.16, 0.13);
          playTone(context, 740, now + 0.38, 0.12, 0.13);
        }

        function isActiveOrderStatus(status) {
          return status === 'NEW' || status === 'PREPARING' || status === 'ON_THE_WAY';
        }

        function computeActiveOrderIds(nextOrders) {
          var ids = {};
          (Array.isArray(nextOrders) ? nextOrders : []).forEach(function (order) {
            if (!order || !order.id || !isActiveOrderStatus(order.status)) return;
            ids[String(order.id)] = true;
          });
          return ids;
        }

        function hasNewOrderId(nextIds) {
          var keys = Object.keys(nextIds || {});
          for (var i = 0; i < keys.length; i += 1) {
            if (!previousActiveOrderIds[keys[i]]) {
              return true;
            }
          }
          return false;
        }

        function getOrderCoordinates(order) {
          var address = order && order.address ? order.address : null;
          var latitude = Number(address && address.latitude);
          var longitude = Number(address && address.longitude);
          if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return null;

          return {
            latitude: Number(latitude.toFixed(7)),
            longitude: Number(longitude.toFixed(7)),
          };
        }

        function googleMapsUrl(latitude, longitude) {
          return 'https://www.google.com/maps?q=' + encodeURIComponent(String(latitude) + ',' + String(longitude));
        }

        function getCounts() {
          return {
            NEW: orders.filter(function (order) { return order.status === 'NEW'; }).length,
            PREPARING: orders.filter(function (order) { return order.status === 'PREPARING'; }).length,
            ON_THE_WAY: orders.filter(function (order) { return order.status === 'ON_THE_WAY'; }).length,
          };
        }

        function renderFilters() {
          var counts = getCounts();

          filterButtons.forEach(function (button) {
            var filter = button.getAttribute('data-filter') || 'NEW';
            var label = statusLabel(filter);

            button.textContent = label + ' (' + numberLabel(counts[filter] || 0) + ')';
            button.classList.toggle('active', filter === activeFilter);
          });
        }

        function filteredOrders() {
          return orders.filter(function (order) {
            return order.status === activeFilter;
          });
        }

        function renderOrders() {
          if (!listElement) return;
          var data = filteredOrders();

          if (!data.length) {
            listElement.innerHTML = '<article class="card orders-empty">لا توجد طلبات ضمن هذا التصنيف حالياً.</article>';
            return;
          }

          listElement.innerHTML = data
            .map(function (order) {
              var route = '/admin/orders/detail?id=' + encodeURIComponent(order.id || '');
              var customerPhone = order.customer && order.customer.phone ? order.customer.phone : '';
              var phone = digitsOnly(customerPhone);
              var whatsappPhone = whatsappDigits(customerPhone);
              var hasNotes = Boolean(String(order && order.notes ? order.notes : '').trim());
              var coordinates = getOrderCoordinates(order);
              var mapUrl = coordinates ? googleMapsUrl(coordinates.latitude, coordinates.longitude) : '';
              var whatsappUrl = whatsappPhone ? 'https://wa.me/' + encodeURIComponent(whatsappPhone) : '';

              return [
                '<article class="card stack">',
                '  <div class="row">',
                '    <span class="tag orders-status-tag ' + statusClass(order.status) + '">' + escapeHtml(statusLabel(order.status)) + '</span>',
                '    <strong class="orders-customer">طلب #' + escapeHtml(order.orderNumber || '-') + '</strong>',
                '  </div>',
                '  <div class="row">',
                '    <div>',
                '      <div class="muted tiny">العميل</div>',
                '      <strong>' + escapeHtml(order.customer && order.customer.name ? order.customer.name : '-') + '</strong>',
                '    </div>',
                '    <div class="text-left">',
                '      <div class="muted tiny">الإجمالي</div>',
                '      <div class="price-sm">' + escapeHtml(formatMoney(order.total)) + '</div>',
                '    </div>',
                '  </div>',
                hasNotes
                  ? '  <div class="orders-note"><span class="orders-note-label">ملاحظات الطلب:</span><p class="orders-note-text">' + escapeHtml(order.notes) + '</p></div>'
                  : '',
                '  <div class="row">',
                '    <span class="muted tiny">' + escapeHtml(formatDateTime(order.createdAt)) + '</span>',
                '    <span class="muted tiny">' + escapeHtml(order.customer && order.customer.phone ? order.customer.phone : '-') + '</span>',
                '  </div>',
                '  <div class="action-row">',
                '    <button class="pill active" data-route="' + escapeHtml(route) + '">عرض التفاصيل</button>',
                mapUrl
                  ? '    <a class="icon-btn" href="' + escapeHtml(mapUrl) + '" target="_blank" rel="noopener noreferrer" title="فتح الموقع على Google Maps"><span class="material-symbols-outlined">map</span></a>'
                  : '    <span></span>',
                phone
                  ? '    <a class="icon-btn" href="tel:' + escapeHtml(phone) + '" title="اتصال"><span class="material-symbols-outlined">call</span></a>'
                  : '    <span></span>',
                whatsappUrl
                  ? '    <a class="icon-btn" href="' + escapeHtml(whatsappUrl) + '" target="_blank" rel="noopener noreferrer" title="واتساب" aria-label="فتح واتساب">' + WHATSAPP_ICON_SVG + '</a>'
                  : '    <span></span>',
                '  </div>',
                '</article>',
              ].join('');
            })
            .join('');

          window.AdminBridge.bindRoutes(listElement);
        }

        function bindFilters() {
          filterButtons.forEach(function (button) {
            button.addEventListener('click', function () {
              activeFilter = button.getAttribute('data-filter') || 'NEW';
              renderFilters();
              renderOrders();
            });
          });
        }

        async function loadCurrentOrders(options) {
          var silent = Boolean(options && options.silent);
          if (!listElement) return;
          if (!silent) {
            listElement.innerHTML = '<article class="card orders-empty">جاري تحميل الطلبات...</article>';
          }

          try {
            var response = await window.AdminBridge.apiRequest('/admin/orders/current');
            var nextOrders = Array.isArray(response) ? response : [];
            var nextActiveOrderIds = computeActiveOrderIds(nextOrders);

            if (initialOrdersLoaded && hasNewOrderId(nextActiveOrderIds)) {
              playNewOrderSound();
            }

            previousActiveOrderIds = nextActiveOrderIds;
            initialOrdersLoaded = true;
            orders = nextOrders;
            renderFilters();
            renderOrders();
          } catch (error) {
            orders = [];
            renderFilters();
            if (!silent) {
              listElement.innerHTML =
                '<article class="card orders-empty">تعذر تحميل الطلبات. تأكد من تسجيل الدخول بحساب أدمن.</article>';
            }
          }
        }

        function startOrdersPolling() {
          if (ordersPollingTimer) return;
          ordersPollingTimer = window.setInterval(function () {
            if (ordersPollingInFlight) return;
            ordersPollingInFlight = true;
            loadCurrentOrders({ silent: true })
              .catch(function () {
                // ignored in polling
              })
              .finally(function () {
                ordersPollingInFlight = false;
              });
          }, 5000);
        }

        bindAdminAudioUnlock();
        bindFilters();
        loadCurrentOrders();
        startOrdersPolling();

        window.addEventListener('beforeunload', function () {
          if (ordersPollingTimer) {
            window.clearInterval(ordersPollingTimer);
            ordersPollingTimer = null;
          }
        });
      })();
    </script>
  </body>
</html>
