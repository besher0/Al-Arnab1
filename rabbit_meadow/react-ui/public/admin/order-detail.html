<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تفاصيل الطلب</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Almarai:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link href="/admin/admin.css" rel="stylesheet" />
  </head>
  <body>
    <section class="admin-shell admin-compact">
      <header class="admin-header">
        <button class="icon-btn" data-route="/admin/orders/current" title="رجوع">
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
        <div class="header-group">
          <div>
            <h1 id="order-title" class="page-title">تفاصيل الطلب</h1>
          </div>
        </div>
        <img
          class="avatar"
          src="https://images.unsplash.com/photo-1521119989659-a83eee488004?auto=format&fit=crop&w=120&q=80"
          alt="admin"
        />
      </header>

      <main class="container stack">
        <section class="card stack">
          <div class="row">
            <div>
              <div class="muted tiny">اسم العميل</div>
              <strong id="order-customer" class="orders-customer">-</strong>
            </div>
            <div class="text-left">
              <div class="muted tiny">إجمالي الطلب</div>
              <div id="order-total" class="price-sm">0 ر.س</div>
            </div>
          </div>

          <article id="assigned-delivery-wrap" class="soft-card" style="display: none">
            <div class="row">
              <span class="material-symbols-outlined" style="color: #67bbde">local_shipping</span>
              <div>
                <div class="muted tiny">المندوب المكلّف</div>
                <strong id="assigned-delivery-name">-</strong>
              </div>
              <a
                id="assigned-delivery-call"
                class="icon-btn"
                href="#"
                style="display: none"
                title="اتصال بالمندوب"
              >
                <span class="material-symbols-outlined">call</span>
              </a>
            </div>
          </article>

          <div id="order-items" class="stack">
            <article class="soft-card orders-empty">جاري تحميل المنتجات...</article>
          </div>
        </section>

        <section>
          <h3 class="section-title" style="margin-bottom: 8px">عنوان التوصيل</h3>
          <article class="card">
            <div class="row">
              <span class="material-symbols-outlined" style="color: #67bbde">home</span>
              <strong id="order-address">-</strong>
            </div>
            <a
              id="order-map-link"
              class="pill"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              style="display:none;margin-top:12px;text-align:center;text-decoration:none"
            >فتح الموقع على Google Maps</a>
          </article>
        </section>

        <section id="order-notes-card" style="display: none">
          <h3 class="section-title" style="margin-bottom: 8px">ملاحظات الطلب</h3>
          <article class="card">
            <p id="order-notes" class="muted" style="white-space: pre-line; line-height: 1.7">-</p>
          </article>
        </section>

        <section id="accept-section" class="soft-card stack">
          <h3>قبول الطلب وتحديد وقت التجهيز</h3>
          <div class="row orders-filter-row" id="prep-options">
            <button class="pill" data-prep-minutes="15" type="button">15 دقيقة</button>
            <button class="pill active" data-prep-minutes="20" type="button">20 دقيقة</button>
            <button class="pill" data-prep-minutes="30" type="button">30 دقيقة</button>
          </div>
          <div class="stack" style="gap: 6px">
            <div class="row" style="align-items: center">
              <label class="label" for="delivery-assignee-select" style="margin: 0">اختر مندوب الدليفري</label>
              <span
                class="material-symbols-outlined"
                style="color: #67bbde; font-size: 31px; line-height: 1"
                title="اختيار مندوب التوصيل"
              >local_shipping</span>
            </div>
            <select id="delivery-assignee-select" class="select-field">
              <option value="">جاري تحميل المناديب...</option>
            </select>
            <div id="delivery-assignee-feedback" class="tiny muted"></div>
          </div>
          <button id="accept-order" class="cta" type="button">
            <span class="material-symbols-outlined" style="vertical-align: middle">check_circle</span>
            قبول الطلب
          </button>
        </section>

        <section id="reject-section" class="card stack" style="border-style: dashed">
          <h3 style="color: var(--admin-danger)">رفض الطلب</h3>
          <div class="row orders-filter-row" id="reject-options">
            <button class="chip active" data-reject-reason="المادة غير متوفرة" type="button">
              المادة غير متوفرة
            </button>
            <button class="chip" data-reject-reason="ضغط كبير" type="button">ضغط كبير</button>
            <button class="chip" data-reject-reason="خارج نطاق التغطية" type="button">خارج نطاق التغطية</button>
          </div>
          <button id="reject-order" class="outline-danger" type="button">
            <span class="material-symbols-outlined" style="vertical-align: middle">cancel</span>
            رفض الطلب
          </button>
        </section>

        <div id="order-feedback" class="tiny muted"></div>
      </main>

      <nav class="bottom-nav">
        <button class="nav-item" data-route="/admin/dashboard">
          <span class="material-symbols-outlined nav-icon">settings</span>
          Settings
        </button>
        <button class="nav-item" data-route="/admin/orders/completed">
          <span class="material-symbols-outlined nav-icon">inventory_2</span>
          Inventory
        </button>
        <button class="nav-item" data-route="/admin/reports/sales">
          <span class="material-symbols-outlined nav-icon">history</span>
          History
        </button>
        <button class="nav-item active" data-route="/admin/orders/current">
          <span class="material-symbols-outlined nav-icon">shopping_basket</span>
          Orders
        </button>
      </nav>
    </section>

    <script src="/admin/admin-bridge.js"></script>
    <script>
      (function () {
        if (!window.AdminBridge || typeof window.AdminBridge.apiRequest !== 'function') {
          return;
        }

        var titleNode = document.getElementById('order-title');
        var customerNode = document.getElementById('order-customer');
        var totalNode = document.getElementById('order-total');
        var itemsNode = document.getElementById('order-items');
        var addressNode = document.getElementById('order-address');
        var orderMapLinkNode = document.getElementById('order-map-link');
        var notesCard = document.getElementById('order-notes-card');
        var notesNode = document.getElementById('order-notes');
        var feedbackNode = document.getElementById('order-feedback');
        var assignedDeliveryWrap = document.getElementById('assigned-delivery-wrap');
        var assignedDeliveryName = document.getElementById('assigned-delivery-name');
        var assignedDeliveryCall = document.getElementById('assigned-delivery-call');

        var acceptButton = document.getElementById('accept-order');
        var rejectButton = document.getElementById('reject-order');
        var acceptSection = document.getElementById('accept-section');
        var rejectSection = document.getElementById('reject-section');
        var deliverySelectNode = document.getElementById('delivery-assignee-select');
        var deliveryFeedbackNode = document.getElementById('delivery-assignee-feedback');

        var prepButtons = Array.prototype.slice.call(document.querySelectorAll('[data-prep-minutes]'));
        var rejectButtons = Array.prototype.slice.call(document.querySelectorAll('[data-reject-reason]'));

        var params = new URLSearchParams(window.location.search);
        var orderId = params.get('id') || '';
        var selectedPrepMinutes = 20;
        var selectedRejectReason = 'المادة غير متوفرة';
        var selectedDeliveryId = '';
        var deliveryAssignees = [];
        var isStatusLocked = false;

        function escapeHtml(value) {
          return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function formatMoney(value) {
          return Number(value || 0).toLocaleString('ar-SA', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          }) + ' ر.س';
        }

        function setFeedback(message, isError) {
          if (!feedbackNode) return;
          feedbackNode.textContent = message || '';
          feedbackNode.classList.toggle('is-error', Boolean(message) && Boolean(isError));
          feedbackNode.classList.toggle('is-success', Boolean(message) && !isError);
        }

        function formatErrorMessage(error) {
          if (!error) return '';
          var message = '';

          if (typeof error === 'string') {
            message = error;
          } else if (error && typeof error.message === 'string') {
            message = error.message;
          }

          message = String(message || '').trim();
          if (!message || message === 'request-failed') return '';
          if (message === 'missing-token') return 'انتهت الجلسة. يرجى تسجيل الدخول من جديد.';
          return message;
        }

        function setDeliveryFeedback(message, isError) {
          if (!deliveryFeedbackNode) return;
          deliveryFeedbackNode.textContent = message || '';
          deliveryFeedbackNode.style.color =
            Boolean(message) && Boolean(isError) ? 'var(--admin-danger)' : 'var(--admin-muted)';
        }

        function deliveryOptionLabel(delivery, index) {
          var fallbackName = 'مندوب #' + String(index + 1);
          var name = String((delivery && delivery.name) || fallbackName);
          var phone = String((delivery && delivery.phone) || '').trim();
          var activeOrdersCount = Number(delivery && delivery.activeOrdersCount);
          var activeOrdersText = Number.isFinite(activeOrdersCount)
            ? activeOrdersCount.toLocaleString('ar-SA')
            : '0';

          return (phone ? name + ' - ' + phone : name) + ' (طلبات حالية: ' + activeOrdersText + ')';
        }

        function extractDeliveryRank(delivery, fallbackIndex) {
          var nameText = String((delivery && delivery.name) || '');
          var nameMatch = nameText.match(/\d+/);
          if (nameMatch) {
            var rankFromName = Number(nameMatch[0]);
            if (Number.isFinite(rankFromName)) {
              return rankFromName;
            }
          }

          var phoneText = String((delivery && delivery.phone) || '');
          var phoneMatch = phoneText.match(/(\d+)$/);
          if (phoneMatch) {
            var rankFromPhone = Number(phoneMatch[1]);
            if (Number.isFinite(rankFromPhone)) {
              return rankFromPhone;
            }
          }

          return 1000 + Number(fallbackIndex || 0);
        }

        function normalizeDeliveryAssignees(entries) {
          return (Array.isArray(entries) ? entries : [])
            .map(function (delivery, index) {
              return {
                id: String((delivery && delivery.id) || ''),
                name: String((delivery && delivery.name) || ''),
                phone: String((delivery && delivery.phone) || ''),
                activeOrdersCount: Number((delivery && delivery.activeOrdersCount) || 0),
                __rank: extractDeliveryRank(delivery, index),
                __index: index,
              };
            })
            .filter(function (delivery) {
              return Boolean(delivery.id);
            })
            .sort(function (a, b) {
              if (a.__rank !== b.__rank) {
                return a.__rank - b.__rank;
              }

              var byName = a.name.localeCompare(b.name, 'ar');
              if (byName !== 0) {
                return byName;
              }

              return a.__index - b.__index;
            })
            .map(function (delivery) {
              return {
                id: delivery.id,
                name: delivery.name,
                phone: delivery.phone,
                activeOrdersCount: delivery.activeOrdersCount,
              };
            });
        }

        function renderDeliveryAssignees() {
          if (!deliverySelectNode) return;

          if (!Array.isArray(deliveryAssignees) || !deliveryAssignees.length) {
            selectedDeliveryId = '';
            deliverySelectNode.innerHTML = '<option value="">لا يوجد مندوب دليفري متاح حالياً</option>';
            deliverySelectNode.disabled = true;
            return;
          }

          var selectedExists = deliveryAssignees.some(function (delivery) {
            return String((delivery && delivery.id) || '') === selectedDeliveryId;
          });
          if (!selectedExists) {
            selectedDeliveryId = '';
          }

          var optionsHtml = ['<option value="">-- اختر مندوب الدليفري --</option>']
            .concat(
              deliveryAssignees.map(function (delivery, index) {
                var id = String((delivery && delivery.id) || '');
                var label = deliveryOptionLabel(delivery, index);
                return '<option value="' + escapeHtml(id) + '">' + escapeHtml(label) + '</option>';
              }),
            )
            .join('');

          deliverySelectNode.innerHTML = optionsHtml;
          deliverySelectNode.value = selectedDeliveryId;
          deliverySelectNode.disabled = isStatusLocked;
        }

        function isMissingDeliveriesRoute(error) {
          var message = String(formatErrorMessage(error) || '').toLowerCase();
          if (!message) return false;

          return (
            message.indexOf('cannot get /api/admin/deliveries') !== -1 ||
            message.indexOf('cannot get /admin/deliveries') !== -1
          );
        }

        function extractDeliveryAssigneesFromOrders(orders) {
          var byId = {};
          var list = [];

          (Array.isArray(orders) ? orders : []).forEach(function (order) {
            var delivery = order && order.assignedDelivery;
            var id = String((delivery && delivery.id) || '').trim();
            if (!id) return;

            if (!byId[id]) {
              byId[id] = {
                id: id,
                name: String((delivery && delivery.name) || 'مندوب'),
                phone: String((delivery && delivery.phone) || ''),
                activeOrdersCount: 0,
              };
              list.push(byId[id]);
            }

            byId[id].activeOrdersCount += 1;
          });

          return normalizeDeliveryAssignees(list);
        }

        async function loadDeliveryAssignees() {
          if (!deliverySelectNode) return;

          deliverySelectNode.disabled = true;
          deliverySelectNode.innerHTML = '<option value="">جاري تحميل المناديب...</option>';
          setDeliveryFeedback('', false);

          try {
            var response = await window.AdminBridge.apiRequest('/admin/deliveries');
            deliveryAssignees = normalizeDeliveryAssignees(response);
            renderDeliveryAssignees();
            if (!deliveryAssignees.length) {
              setDeliveryFeedback('لا يوجد مندوب دليفري نشط حالياً.', true);
            }
          } catch (error) {
            if (isMissingDeliveriesRoute(error)) {
              try {
                var currentOrders = await window.AdminBridge.apiRequest('/admin/orders/current');
                deliveryAssignees = extractDeliveryAssigneesFromOrders(currentOrders);
                renderDeliveryAssignees();

                if (deliveryAssignees.length) {
                  setDeliveryFeedback(
                    'تم تحميل المناديب من الطلبات الحالية لأن endpoint /admin/deliveries غير متاح على هذا السيرفر.',
                    false,
                  );
                } else {
                  setDeliveryFeedback(
                    'endpoint /admin/deliveries غير متاح على هذا السيرفر، ولا يوجد مناديب ضمن الطلبات الحالية.',
                    true,
                  );
                }
                return;
              } catch (fallbackError) {
                deliveryAssignees = [];
                renderDeliveryAssignees();
                setDeliveryFeedback(
                  formatErrorMessage(fallbackError) ||
                    'تعذر تحميل المناديب من endpoint الرئيسي أو من fallback.',
                  true,
                );
                return;
              }
            }

            deliveryAssignees = [];
            renderDeliveryAssignees();
            setDeliveryFeedback(
              formatErrorMessage(error) || 'تعذر تحميل قائمة المناديب. حاول مرة ثانية.',
              true,
            );
          }
        }

        function renderItems(items) {
          if (!itemsNode) return;

          if (!Array.isArray(items) || items.length === 0) {
            itemsNode.innerHTML = '<article class="soft-card orders-empty">لا يوجد منتجات داخل هذا الطلب.</article>';
            return;
          }

          itemsNode.innerHTML = items
            .map(function (item) {
              var qty = Number(item.qty || 0).toLocaleString('ar-SA');

              return [
                '<article class="soft-card row">',
                '  <span class="badge-soft">' + escapeHtml(qty) + 'x</span>',
                '  <strong>' + escapeHtml(item.name || '-') + '</strong>',
                '  <span class="muted">' + escapeHtml(formatMoney(item.lineTotal)) + '</span>',
                '</article>',
              ].join('');
            })
            .join('');
        }

        function formatAddress(address) {
          if (!address) return 'لا يوجد عنوان مسجل.';

          var parts = [address.label, address.city, address.street, address.building].filter(Boolean);
          if (!parts.length) return 'لا يوجد عنوان مسجل.';
          return parts.join(' - ');
        }

        function getAddressCoordinates(address) {
          if (!address) return null;

          var latitude = Number(address.latitude);
          var longitude = Number(address.longitude);
          if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return null;

          return {
            latitude: Number(latitude.toFixed(7)),
            longitude: Number(longitude.toFixed(7)),
          };
        }

        function googleMapsUrl(latitude, longitude) {
          return 'https://www.google.com/maps?q=' + encodeURIComponent(String(latitude) + ',' + String(longitude));
        }

        function updateOrderMapLink(address) {
          if (!orderMapLinkNode) return;

          var coordinates = getAddressCoordinates(address);
          if (!coordinates) {
            orderMapLinkNode.style.display = 'none';
            orderMapLinkNode.setAttribute('href', '#');
            return;
          }

          orderMapLinkNode.style.display = 'block';
          orderMapLinkNode.setAttribute('href', googleMapsUrl(coordinates.latitude, coordinates.longitude));
        }

        function updateAssignedDelivery(delivery) {
          if (!assignedDeliveryWrap || !assignedDeliveryName || !assignedDeliveryCall) return;

          if (!delivery || !delivery.name) {
            assignedDeliveryWrap.style.display = 'none';
            assignedDeliveryName.textContent = '-';
            assignedDeliveryCall.style.display = 'none';
            assignedDeliveryCall.setAttribute('href', '#');
            return;
          }

          assignedDeliveryWrap.style.display = '';
          assignedDeliveryName.textContent = delivery.name;

          var phone = String(delivery.phone || '').replace(/[^\d+]/g, '');
          if (!phone) {
            assignedDeliveryCall.style.display = 'none';
            assignedDeliveryCall.setAttribute('href', '#');
            return;
          }

          assignedDeliveryCall.style.display = '';
          assignedDeliveryCall.setAttribute('href', 'tel:' + phone);
        }

        function setActionsDisabled(isDisabled) {
          if (acceptButton) acceptButton.disabled = isDisabled;
          if (rejectButton) rejectButton.disabled = isDisabled;
          if (deliverySelectNode) {
            deliverySelectNode.disabled =
              Boolean(isDisabled) || isStatusLocked || !Array.isArray(deliveryAssignees) || !deliveryAssignees.length;
          }
        }

        function updateActionsVisibility(status) {
          var canManage = status === 'NEW';

          if (acceptSection) {
            acceptSection.style.display = canManage ? '' : 'none';
          }
          if (rejectSection) {
            rejectSection.style.display = canManage ? '' : 'none';
          }
        }

        async function loadOrder() {
          if (!orderId) {
            setFeedback('معرف الطلب غير موجود. ارجع لصفحة الطلبات واختر الطلب من جديد.', true);
            renderItems([]);
            return;
          }

          setFeedback('جاري تحميل تفاصيل الطلب...', false);
          setActionsDisabled(true);

          try {
            var order = await window.AdminBridge.apiRequest('/admin/orders/' + encodeURIComponent(orderId));
            isStatusLocked = ['DELIVERED', 'REJECTED', 'CANCELLED'].indexOf(order.status) !== -1;
            updateActionsVisibility(order.status);
            titleNode.textContent = 'تفاصيل الطلب #' + (order.orderNumber || '-');
            customerNode.textContent = order.customer && order.customer.name ? order.customer.name : '-';
            totalNode.textContent = formatMoney(order.totals && order.totals.total ? order.totals.total : 0);
            addressNode.textContent = formatAddress(order.address);
            updateOrderMapLink(order.address);
            updateAssignedDelivery(order.assignedDelivery);
            if (order.status === 'NEW' && order.assignedDelivery && order.assignedDelivery.id) {
              selectedDeliveryId = String(order.assignedDelivery.id);
            }
            renderDeliveryAssignees();
            renderItems(order.items || []);
            if (notesCard && notesNode) {
              var notes = String(order.notes || '').trim();
              if (notes) {
                notesCard.style.display = '';
                notesNode.textContent = notes;
              } else {
                notesCard.style.display = 'none';
                notesNode.textContent = '-';
              }
            }

            if (isStatusLocked) {
              setFeedback('هذا الطلب مغلق ولا يمكن تعديل حالته.', true);
            } else if (order.status === 'NEW') {
              setFeedback('', false);
            } else if (order.status === 'PREPARING') {
              setFeedback('تم قبول الطلب وتحويله إلى المندوب المكلّف.', false);
            } else if (order.status === 'ON_THE_WAY' || order.status === 'DELIVERED') {
              setFeedback('متابعة التوصيل تتم من حساب الديلفري.', false);
            } else {
              setFeedback('', false);
            }
          } catch (error) {
            setFeedback('تعذر تحميل تفاصيل الطلب.', true);
            renderItems([]);
            updateOrderMapLink(null);
            updateAssignedDelivery(null);
          } finally {
            setActionsDisabled(isStatusLocked);
          }
        }

        async function updateStatus(payload, successMessage) {
          if (!orderId || isStatusLocked) return;

          setActionsDisabled(true);
          setFeedback('جاري تحديث حالة الطلب...', false);

          try {
            await window.AdminBridge.apiRequest('/admin/orders/' + encodeURIComponent(orderId) + '/status', {
              method: 'PATCH',
              body: payload,
            });
            setFeedback(successMessage, false);
            await loadOrder();
          } catch (error) {
            setFeedback(
              formatErrorMessage(error) || 'تعذر تحديث حالة الطلب. حاول مرة ثانية.',
              true,
            );
          } finally {
            setActionsDisabled(false);
          }
        }

        prepButtons.forEach(function (button) {
          button.addEventListener('click', function () {
            prepButtons.forEach(function (item) {
              item.classList.remove('active');
            });
            button.classList.add('active');
            selectedPrepMinutes = Number(button.getAttribute('data-prep-minutes') || 20);
          });
        });

        rejectButtons.forEach(function (button) {
          button.addEventListener('click', function () {
            rejectButtons.forEach(function (item) {
              item.classList.remove('active');
              item.style.background = '';
              item.style.color = '';
            });
            button.classList.add('active');
            selectedRejectReason = button.getAttribute('data-reject-reason') || 'المادة غير متوفرة';
          });
        });

        if (deliverySelectNode) {
          deliverySelectNode.addEventListener('change', function () {
            selectedDeliveryId = String(deliverySelectNode.value || '').trim();
            if (selectedDeliveryId) {
              setDeliveryFeedback('', false);
            }
          });
        }

        acceptButton.addEventListener('click', function () {
          if (!selectedDeliveryId) {
            setFeedback('حدّد مندوب الدليفري قبل قبول الطلب.', true);
            setDeliveryFeedback('اختيار المندوب مطلوب للمتابعة.', true);
            if (deliverySelectNode) {
              deliverySelectNode.focus();
            }
            return;
          }

          updateStatus(
            {
              status: 'PREPARING',
              prepMinutes: selectedPrepMinutes,
              note: 'تم قبول الطلب',
              assignedDeliveryId: selectedDeliveryId,
            },
            'تم قبول الطلب وتحديث وقت التجهيز.',
          );
        });

        rejectButton.addEventListener('click', function () {
          updateStatus(
            {
              status: 'REJECTED',
              rejectReason: selectedRejectReason,
              note: 'تم رفض الطلب',
            },
            'تم رفض الطلب بنجاح.',
          );
        });

        loadDeliveryAssignees();
