<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كل المنتجات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link href="/admin/admin.css" rel="stylesheet" />
  <style>
    .products-table-wrap,
    .categories-table-wrap {
      overflow-x: auto;
    }

    .products-table,
    .categories-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    .products-table th,
    .products-table td,
    .categories-table th,
    .categories-table td {
      text-align: right;
      padding: 10px 8px;
      border-bottom: 1px solid #ebf1f7;
      font-size: 12px;
      vertical-align: middle;
    }

    .products-table th,
    .categories-table th {
      color: var(--admin-primary-deep);
      font-weight: 800;
      white-space: nowrap;
    }

    .products-table tr:last-child td,
    .categories-table tr:last-child td {
      border-bottom: 0;
    }

    .thumb-42 {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      overflow: hidden;
      background: #eaf3fb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #d7e7f4;
    }

    .thumb-42 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-name {
      font-weight: 800;
      color: var(--admin-primary-deep);
    }

    .status-pill {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
    }

    .status-pill.new {
      background: rgba(33, 182, 109, 0.18);
      color: #168e56;
    }

    .status-pill.normal {
      background: rgba(125, 145, 171, 0.18);
      color: #6b7f99;
    }

    .status-pill.off {
      background: rgba(239, 78, 79, 0.14);
      color: #cf3c3c;
    }

    .tiny-action {
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      background: #e8f4fd;
      color: var(--admin-primary-deep);
    }

    .tiny-action.danger {
      background: rgba(239, 78, 79, 0.12);
      color: #cf3c3c;
    }

    .tiny-action.success {
      background: rgba(33, 182, 109, 0.16);
      color: #168e56;
    }

    .actions-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .products-feedback,
    .categories-feedback {
      min-height: 16px;
    }

    .products-feedback.is-error,
    .categories-feedback.is-error {
      color: var(--admin-danger);
    }

    .products-feedback.is-success,
    .categories-feedback.is-success {
      color: var(--admin-success);
    }

    @media (max-width: 900px) {
      .products-table,
      .categories-table {
        min-width: 640px;
      }
    }

    @media (max-width: 640px) {
      .products-table,
      .categories-table {
        min-width: 560px;
      }

      .thumb-42 {
        width: 36px;
        height: 36px;
      }

      .tiny-action {
        padding: 6px 9px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <section class="admin-shell admin-compact">
    <header class="admin-header">
      <button class="icon-btn" data-route="/admin/dashboard" title="رجوع">
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
      <div class="header-group">
        <div>
          <h1 class="page-title" style="font-size: 26px">كل المنتجات والتصنيفات</h1>
          <p class="page-subtitle">إدارة العناصر: إضافة، تعديل، حذف</p>
        </div>
      </div>
    </header>

    <main class="container stack">
      <section class="hero">
        <h2>إدارة المتجر</h2>
        <p>من هذه الصفحة يمكنك تعديل وحذف المنتجات والتصنيفات بسهولة.</p>
      </section>

      <section class="card stack">
        <div class="grid-2">
          <label>
            <div class="label">بحث</div>
            <input id="products-search" class="input-field" type="text" placeholder="ابحث بالاسم أو المعرّف..." />
          </label>
          <label>
            <div class="label">التصنيف</div>
            <select id="products-category-filter" class="select-field">
              <option value="">كل التصنيفات</option>
            </select>
          </label>
        </div>

        <div class="grid-2">
          <label>
            <div class="label">قسم الجديد</div>
            <select id="products-new-filter" class="select-field">
              <option value="all">الكل</option>
              <option value="new">ضمن المنتجات الجديدة</option>
              <option value="normal">غير مضاف للجديد</option>
            </select>
          </label>
          <label>
            <div class="label">الحالة العامة</div>
            <select id="products-active-filter" class="select-field">
              <option value="all">الكل</option>
              <option value="active">فعّال</option>
              <option value="inactive">غير فعّال</option>
            </select>
          </label>
        </div>

        <div class="row">
          <button id="products-refresh" class="pill" type="button">تحديث</button>
          <button class="pill active" data-route="/admin/products/new" type="button">إضافة منتج</button>
        </div>

        <div id="products-feedback" class="tiny muted products-feedback"></div>
      </section>

      <section class="new-products-table-card">
        <div class="products-table-wrap">
          <table class="products-table">
            <thead>
              <tr>
                <th>الصورة</th>
                <th>المنتج</th>
                <th>المعرّف</th>
                <th>التصنيف</th>
                <th>السعر</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="products-list-body">
              <tr>
                <td colspan="7" class="muted text-center">جاري تحميل المنتجات...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="card stack">
        <div class="row">
          <h3 class="section-title section-title-inline">إدارة التصنيفات</h3>
          <button class="pill active" data-route="/admin/categories/new" type="button">إضافة صنف</button>
        </div>

        <div id="categories-feedback" class="tiny muted categories-feedback"></div>

        <div class="categories-table-wrap">
          <table class="categories-table">
            <thead>
              <tr>
                <th>الصورة</th>
                <th>الاسم</th>
                <th>Slug</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="categories-list-body">
              <tr>
                <td colspan="5" class="muted text-center">جاري تحميل التصنيفات...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </section>

  <script src="/admin/admin-bridge.js"></script>
  <script>
    (function () {
      if (!window.AdminBridge) return;

      var searchInput = document.getElementById('products-search');
      var categoryFilter = document.getElementById('products-category-filter');
      var newFilter = document.getElementById('products-new-filter');
      var activeFilter = document.getElementById('products-active-filter');
      var refreshButton = document.getElementById('products-refresh');
      var productsBody = document.getElementById('products-list-body');
      var categoriesBody = document.getElementById('categories-list-body');
      var productsFeedback = document.getElementById('products-feedback');
      var categoriesFeedback = document.getElementById('categories-feedback');

      var state = {
        products: [],
        categories: [],
        currency: 'SYP',
      };

      function setFeedback(node, message, isError) {
        if (!node) return;
        node.textContent = message || '';
        node.classList.toggle('is-error', Boolean(isError));
        node.classList.toggle('is-success', Boolean(message) && !isError);
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatNumber(value) {
        return Number(value || 0).toLocaleString('ar-SA', { maximumFractionDigits: 2 });
      }

      function currencyLabel(currency) {
        var code = String(currency || '').toUpperCase();
        if (code === 'SYP') return 'ل.س';
        if (code === 'SAR') return 'ر.س';
        return code || 'ل.س';
      }

      function formatMoney(value) {
        return formatNumber(value) + ' ' + currencyLabel(state.currency);
      }

      function populateCategoryFilter() {
        if (!categoryFilter) return;

        var selected = String(categoryFilter.value || '');
        categoryFilter.innerHTML = '<option value="">كل التصنيفات</option>';
        state.categories.forEach(function (category) {
          var option = document.createElement('option');
          option.value = category.id;
          option.textContent = category.nameAr;
          categoryFilter.appendChild(option);
        });
        categoryFilter.value = selected;
      }

      function filteredProducts() {
        var query = String((searchInput && searchInput.value) || '').trim().toLowerCase();
        var categoryId = String((categoryFilter && categoryFilter.value) || '');
        var newState = String((newFilter && newFilter.value) || 'all');
        var activeState = String((activeFilter && activeFilter.value) || 'all');

        return state.products.filter(function (product) {
          var name = String(product && product.nameAr ? product.nameAr : '').toLowerCase();
          var id = String(product && product.id ? product.id : '').toLowerCase();
          var categoryName = String(product && product.categoryName ? product.categoryName : '').toLowerCase();

          if (query && name.indexOf(query) === -1 && id.indexOf(query) === -1 && categoryName.indexOf(query) === -1) {
            return false;
          }

          if (categoryId && String(product.categoryId || '') !== categoryId) {
            return false;
          }

          if (newState === 'new' && !product.isNew) return false;
          if (newState === 'normal' && product.isNew) return false;
          if (activeState === 'active' && !product.isActive) return false;
          if (activeState === 'inactive' && product.isActive) return false;

          return true;
        });
      }

      function productStatus(product) {
        var isNew = Boolean(product && product.isNew);
        var isActive = Boolean(product && product.isActive);
        if (!isActive) {
          return { className: 'off', label: 'غير فعّال' };
        }
        if (isNew) {
          return { className: 'new', label: 'ضمن الجديد' };
        }
        return { className: 'normal', label: 'فعّال' };
      }

      function renderProducts() {
        if (!productsBody) return;

        var products = filteredProducts();
        if (!products.length) {
          productsBody.innerHTML = '<tr><td colspan="7" class="muted text-center">لا توجد منتجات مطابقة للفلاتر.</td></tr>';
          return;
        }

        productsBody.innerHTML = products
          .map(function (product) {
            var status = productStatus(product);
            var id = String(product.id || '');
            var offerRoute = '/admin/discounts/new?productId=' + encodeURIComponent(id);
            var editRoute = '/admin/products/new?editId=' + encodeURIComponent(id);

            return [
              '<tr>',
              '  <td>',
              '    <span class="thumb-42">' +
                    (product.imageUrl
                      ? '<img src="' + escapeHtml(product.imageUrl) + '" alt="' + escapeHtml(product.nameAr || 'منتج') + '"/>'
                      : '<span class="material-symbols-outlined" style="font-size:18px;color:#63b4db">image</span>') +
              '    </span>',
              '  </td>',
              '  <td><div class="product-name">' + escapeHtml(product.nameAr || '-') + '</div></td>',
              '  <td><code>' + escapeHtml(id || '-') + '</code></td>',
              '  <td>' + escapeHtml(product.categoryName || '-') + '</td>',
              '  <td>' + escapeHtml(formatMoney(product.sellPrice || 0)) + '</td>',
              '  <td><span class="status-pill ' + status.className + '">' + status.label + '</span></td>',
              '  <td>',
              '    <div class="actions-inline">',
              '      <button class="tiny-action" data-edit-product="' + escapeHtml(editRoute) + '">تعديل</button>',
              '      <button class="tiny-action" data-open-offer-route="' + escapeHtml(offerRoute) + '">عرض</button>',
              '      <button class="tiny-action danger" data-delete-product="' + escapeHtml(id) + '">حذف</button>',
              '    </div>',
              '  </td>',
              '</tr>',
            ].join('');
          })
          .join('');
      }

      function renderCategories() {
        if (!categoriesBody) return;

        if (!state.categories.length) {
          categoriesBody.innerHTML = '<tr><td colspan="5" class="muted text-center">لا توجد تصنيفات حالياً.</td></tr>';
          return;
        }

        categoriesBody.innerHTML = state.categories
          .map(function (category) {
            var isActive = Boolean(category && category.isActive);
            var statusClass = isActive ? 'new' : 'off';
            var statusLabel = isActive ? 'فعّال' : 'مخفي';
            return [
              '<tr>',
              '  <td>',
              '    <span class="thumb-42">' +
                    (category.imageUrl
                      ? '<img src="' + escapeHtml(category.imageUrl) + '" alt="' + escapeHtml(category.nameAr || 'صنف') + '"/>'
                      : '<span class="material-symbols-outlined" style="font-size:18px;color:#63b4db">category</span>') +
              '    </span>',
              '  </td>',
              '  <td><strong>' + escapeHtml(category.nameAr || '-') + '</strong></td>',
              '  <td><code>' + escapeHtml(category.slug || '-') + '</code></td>',
              '  <td><span class="status-pill ' + statusClass + '">' + statusLabel + '</span></td>',
              '  <td>',
              '    <div class="actions-inline">',
              '      <button class="tiny-action" data-edit-category="' + escapeHtml(category.id) + '">تعديل</button>',
              '      <button class="tiny-action danger" data-delete-category="' + escapeHtml(category.id) + '">حذف</button>',
              '    </div>',
              '  </td>',
              '</tr>',
            ].join('');
          })
          .join('');
      }

      async function loadStoreSettings() {
        try {
          var settings = await window.AdminBridge.apiRequest('/admin/settings/store');
          state.currency = settings && settings.currency ? String(settings.currency) : state.currency;
        } catch (_error) {
          // Keep default
        }
      }

      async function loadProducts() {
        setFeedback(productsFeedback, 'جاري تحميل المنتجات...', false);
        if (productsBody) {
          productsBody.innerHTML = '<tr><td colspan="7" class="muted text-center">جاري تحميل المنتجات...</td></tr>';
        }

        try {
          var products = await window.AdminBridge.apiRequest('/admin/products');
          state.products = Array.isArray(products) ? products : [];
          renderProducts();
          setFeedback(productsFeedback, 'تم تحميل ' + state.products.length + ' منتج.', false);
        } catch (_error) {
          state.products = [];
          renderProducts();
          setFeedback(productsFeedback, 'تعذر تحميل المنتجات.', true);
        }
      }

      async function loadCategories() {
        setFeedback(categoriesFeedback, 'جاري تحميل التصنيفات...', false);
        if (categoriesBody) {
          categoriesBody.innerHTML = '<tr><td colspan="5" class="muted text-center">جاري تحميل التصنيفات...</td></tr>';
        }

        try {
          var categories = await window.AdminBridge.apiRequest('/admin/categories');
          state.categories = Array.isArray(categories) ? categories : [];
          renderCategories();
          populateCategoryFilter();
          setFeedback(categoriesFeedback, 'تم تحميل ' + state.categories.length + ' تصنيف.', false);
        } catch (_error) {
          state.categories = [];
          renderCategories();
          setFeedback(categoriesFeedback, 'تعذر تحميل التصنيفات.', true);
        }
      }

      async function deleteProduct(productId) {
        if (!productId) return;
        if (!window.confirm('هل تريد إخفاء هذا المنتج؟')) return;

        try {
          await window.AdminBridge.apiRequest('/admin/products/' + encodeURIComponent(productId), {
            method: 'DELETE',
          });
          setFeedback(productsFeedback, 'تم حذف المنتج بنجاح.', false);
          await loadProducts();
        } catch (_error) {
          setFeedback(productsFeedback, 'تعذر حذف المنتج.', true);
        }
      }

      async function editCategory(categoryId) {
        var category = state.categories.find(function (item) {
          return String(item.id || '') === String(categoryId || '');
        });
        if (!category) return;

        var nextName = window.prompt('اسم التصنيف الجديد:', String(category.nameAr || ''));
        if (nextName === null) return;
        var cleanName = String(nextName || '').trim();
        if (!cleanName) {
          setFeedback(categoriesFeedback, 'اسم التصنيف مطلوب.', true);
          return;
        }

        try {
          await window.AdminBridge.apiRequest('/admin/categories/' + encodeURIComponent(categoryId), {
            method: 'PATCH',
            body: {
              nameAr: cleanName,
            },
          });
          setFeedback(categoriesFeedback, 'تم تعديل التصنيف.', false);
          await loadCategories();
          await loadProducts();
        } catch (_error) {
          setFeedback(categoriesFeedback, 'تعذر تعديل التصنيف.', true);
        }
      }

      async function deleteCategory(categoryId) {
        if (!categoryId) return;
        if (!window.confirm('سيتم إخفاء التصنيف ومنتجاته. متابعة؟')) return;

        try {
          await window.AdminBridge.apiRequest('/admin/categories/' + encodeURIComponent(categoryId), {
            method: 'DELETE',
          });
          setFeedback(categoriesFeedback, 'تم حذف التصنيف بنجاح.', false);
          await loadCategories();
          await loadProducts();
        } catch (_error) {
          setFeedback(categoriesFeedback, 'تعذر حذف التصنيف.', true);
        }
      }

      document.addEventListener('click', function (event) {
        var offerButton = event.target.closest('[data-open-offer-route]');
        if (offerButton) {
          event.preventDefault();
          window.AdminBridge.go(offerButton.getAttribute('data-open-offer-route') || '/admin/discounts/new');
          return;
        }

        var editProductButton = event.target.closest('[data-edit-product]');
        if (editProductButton) {
          event.preventDefault();
          window.AdminBridge.go(editProductButton.getAttribute('data-edit-product') || '/admin/products/new');
          return;
        }

        var deleteProductButton = event.target.closest('[data-delete-product]');
        if (deleteProductButton) {
          event.preventDefault();
          deleteProduct(deleteProductButton.getAttribute('data-delete-product') || '');
          return;
        }

        var editCategoryButton = event.target.closest('[data-edit-category]');
        if (editCategoryButton) {
          event.preventDefault();
          editCategory(editCategoryButton.getAttribute('data-edit-category') || '');
          return;
        }

        var deleteCategoryButton = event.target.closest('[data-delete-category]');
        if (deleteCategoryButton) {
          event.preventDefault();
          deleteCategory(deleteCategoryButton.getAttribute('data-delete-category') || '');
        }
      });

      [searchInput, categoryFilter, newFilter, activeFilter].forEach(function (node) {
        if (!node) return;
        node.addEventListener('input', renderProducts);
        node.addEventListener('change', renderProducts);
      });

      if (refreshButton) {
        refreshButton.addEventListener('click', function () {
          Promise.all([loadStoreSettings(), loadCategories(), loadProducts()]);
        });
      }

      Promise.resolve()
        .then(loadStoreSettings)
        .then(loadCategories)
        .then(loadProducts);
    })();
  </script>
</body>
</html>
