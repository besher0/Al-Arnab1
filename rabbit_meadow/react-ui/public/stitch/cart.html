<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/stitch/tailwind/cart.css" />
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Almarai', sans-serif;
      background-color: #f0f9ff;
    }
    .organic-card-shape {
      border-radius: 1.5rem;
    }
    html,
    body {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    body.cart-sheet-mode {
      background-color: rgba(15, 23, 42, 0.35);
    }

    body.cart-sheet-mode header {
      position: static;
      width: min(760px, calc(100% - 24px));
      margin: 14px auto 0;
      border-radius: 20px;
      border: 1px solid #cfe6f7;
    }

    body.cart-sheet-mode main {
      width: min(760px, calc(100% - 24px));
      margin: 10px auto 18px;
      padding-top: 18px;
      padding-bottom: 26px;
      background: #ffffff;
      border-radius: 24px;
      border: 1px solid #dceeff;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.24);
    }

    body.cart-sheet-mode nav {
      display: none;
    }
  </style>
  <script src="/stitch/stitch-alert.js"></script>
  <script src="/stitch/stitch-notifications.js"></script>
</head>
<body class="text-on-surface min-h-screen pb-32">
  <header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md flex justify-between items-center px-6 py-4 border-b border-primary/10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white shadow-sm">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pets</span>
      </div>
      <h1 class="text-on-surface font-tajawal font-bold text-2xl tracking-tight">الأرنب</h1>
    </div>
    <div class="flex items-center gap-2">
      <button data-notification-button class="text-on-surface-variant hover:text-primary transition-colors" type="button">
        <span class="material-symbols-outlined">notifications</span>
      </button>
      <button data-close-cart class="hidden text-on-surface-variant hover:text-primary transition-colors" type="button" title="إغلاق السلة">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
  </header>

  <main id="cart-main" class="pt-24 px-4 max-w-2xl mx-auto space-y-6">
    <section class="space-y-4">
      <h2 class="font-tajawal font-extrabold text-xl text-on-surface px-2">محتويات السلة</h2>
      <div id="cart-items-container" class="space-y-4"></div>

      <div class="bg-white rounded-2xl p-6 border border-sky-100 shadow-sm">
        <h3 class="font-tajawal font-bold text-lg mb-4 text-on-surface border-b border-sky-50 pb-2">ملخص الطلب</h3>
        <div class="space-y-3">
          <div class="flex justify-between text-sm">
            <span class="text-on-surface-variant">المجموع الفرعي (<span id="summary-item-count">0</span> وحدات)</span>
            <span class="font-bold" id="summary-subtotal">0.00 ر.س</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-on-surface-variant">رسوم التوصيل</span>
            <span class="font-bold text-emerald-600">مجاني</span>
          </div>
          <div class="h-px bg-sky-100 my-4"></div>
          <div class="flex justify-between text-xl">
            <span class="font-tajawal font-bold">الإجمالي الكلي</span>
            <span class="font-tajawal font-extrabold text-primary" id="summary-total">0.00 ر.س</span>
          </div>
        </div>
      </div>
    </section>

    <section class="space-y-4">
      <h2 class="font-tajawal font-extrabold text-xl text-on-surface px-2">تفاصيل الطلب</h2>

      <div class="relative h-44 rounded-2xl overflow-hidden shadow-sm border border-sky-100 bg-sky-50">
        <div class="absolute inset-0 bg-sky-500/5 flex items-center justify-center pointer-events-none">
          <div class="bg-white p-3 rounded-full shadow-lg">
            <span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">location_on</span>
          </div>
        </div>
        <div class="absolute bottom-3 right-3 left-3 bg-white/95 p-3 rounded-xl text-sm font-bold flex items-center gap-3 shadow-md border border-sky-50">
          <span class="material-symbols-outlined text-primary text-xl">home</span>
          <span class="text-on-surface" id="selected-location-label" role="button" tabindex="0" aria-label="Open selected location in Google Maps">الموقع غير محدد بعد</span>
        </div>
      </div>

      <div class="space-y-2">
        <button id="detect-location-button" type="button" class="w-full h-12 rounded-full border border-primary/20 bg-white text-primary font-bold hover:bg-primary/5 transition-colors">تحديد موقعي عبر GPS</button>
        <p id="location-status-text" class="text-xs text-on-surface-variant px-1">يرجى تحديد موقعك قبل تأكيد الطلب.</p>
      </div>

      <button id="confirm-order-button" class="w-full py-5 rounded-full bg-primary text-on-primary font-tajawal font-bold text-xl shadow-lg shadow-sky-200 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-3 disabled:opacity-60 disabled:cursor-not-allowed" type="button">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        <span data-confirm-label>تأكيد الطلب</span>
      </button>
    </section>
  </main>

  <nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-xl flex justify-around items-center px-2 pt-3 pb-6 rounded-t-[3rem] z-50 shadow-[0_-4px_32px_rgba(0,0,0,0.05)]">
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <span class="material-symbols-outlined" data-icon="home">home</span>
      <span class="font-label text-[11px] font-semibold mt-1">الرئيسية</span>
    </a>
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <span class="material-symbols-outlined" data-icon="grid_view">grid_view</span>
      <span class="font-label text-[11px] font-semibold mt-1">الأقسام</span>
    </a>
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
      <span class="font-label text-[11px] font-semibold mt-1">طلباتي</span>
    </a>
    <a class="flex flex-col items-center justify-center bg-[#87CEEB] text-white rounded-[24px] px-5 py-2" href="#">
      <div class="relative">
        <span class="material-symbols-outlined" data-icon="shopping_cart" data-weight="fill" style="font-variation-settings: 'FILL' 1;">shopping_cart</span>
        <span class="cart-badge absolute -top-2 -right-2 bg-red-500 text-white text-[9px] min-w-[16px] h-4 px-1 rounded-full border-2 border-white hidden items-center justify-center leading-none">٠</span>
      </div>
      <span class="font-label text-[11px] font-semibold mt-1">السلة</span>
    </a>
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <span class="material-symbols-outlined" data-icon="person">person</span>
      <span class="font-label text-[11px] font-semibold mt-1">حسابي</span>
    </a>
  </nav>

  <script>
    (function () {
      var ITEM_NOTES_STORAGE_KEY = 'al-arnab-cart-item-notes';
      var itemsContainer = document.getElementById('cart-items-container');
      var summaryItemCount = document.getElementById('summary-item-count');
      var summarySubtotal = document.getElementById('summary-subtotal');
      var summaryTotal = document.getElementById('summary-total');
      var closeCartButton = document.querySelector('[data-close-cart]');
      var notificationButton = document.querySelector('[data-notification-button]');

      var detectLocationButton = document.getElementById('detect-location-button');
      var locationStatusText = document.getElementById('location-status-text');
      var selectedLocationLabel = document.getElementById('selected-location-label');
      var confirmButton = document.getElementById('confirm-order-button');
      var confirmLabel = confirmButton ? confirmButton.querySelector('[data-confirm-label]') : null;
      var query = new URLSearchParams(window.location.search || '');
      var isSheetMode = ['1', 'true', 'yes'].indexOf(String(query.get('sheet') || '').toLowerCase()) !== -1;
      var closeRoute = String(query.get('from') || '/home');
      if (closeRoute.charAt(0) !== '/') {
        closeRoute = '/home';
      }

      var state = {
        qtyById: {},
        unitById: {},
        itemsById: {},
        notesById: loadNotes(),
        isAuthenticated: false,
        itemCount: 0,
        location: null,
        isCheckoutLoading: false,
        currency: 'SYP',
      };

      function send(type, payload) {
        window.parent.postMessage(
          Object.assign({ source: 'stitch-frame', type: type }, payload || {}),
          window.location.origin,
        );
      }

      function toArabicNumber(value) {
        var map = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
        return String(value).replace(/[0-9]/g, function (digit) {
          return map[Number(digit)] || digit;
        });
      }

      function loadNotes() {
        try {
          var raw = window.localStorage.getItem(ITEM_NOTES_STORAGE_KEY) || '{}';
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
            return {};
          }
          var normalized = {};
          Object.keys(parsed).forEach(function (key) {
            var cleanKey = String(key || '').trim();
            var cleanValue = String(parsed[key] || '').trim();
            if (cleanKey && cleanValue) {
              normalized[cleanKey] = cleanValue.slice(0, 400);
            }
          });
          return normalized;
        } catch (error) {
          return {};
        }
      }

      function saveNotes() {
        try {
          window.localStorage.setItem(ITEM_NOTES_STORAGE_KEY, JSON.stringify(state.notesById));
        } catch (error) {
          // Ignore storage errors.
        }
      }

      function setFooterCartCount(count) {
        var next = Math.max(0, Number(count) || 0);
        var badges = document.querySelectorAll('.cart-badge');
        badges.forEach(function (badge) {
          badge.textContent = toArabicNumber(next);
          badge.style.display = next > 0 ? 'flex' : 'none';
        });
      }
      function currencyLabel(currency) {
        var code = String(currency || '').toUpperCase();
        if (code === 'SAR') return 'ر.س';
        if (code === 'SYP') return 'ل.س';
        return code || 'ل.س';
      }

      function applyStore(storePayload) {
        if (!storePayload || typeof storePayload !== 'object') return;
        state.currency = String(storePayload.currency || state.currency || 'SYP').toUpperCase();
      }

      function formatSar(value) {
        return (Math.max(0, Number(value) || 0)).toFixed(2) + ' ' + currencyLabel(state.currency);
      }

      function isWeightUnit(unit) {
        return String(unit || '').toUpperCase() === 'KG';
      }

      function qtyStep(unit) {
        return isWeightUnit(unit) ? 0.01 : 1;
      }

      function normalizeQty(value, unit) {
        var parsed = Number(value);
        if (!Number.isFinite(parsed) || parsed <= 0) {
          return 0;
        }
        if (isWeightUnit(unit)) {
          var roundedWeight = Math.round(parsed * 100) / 100;
          return roundedWeight < 0.01 ? 0.01 : roundedWeight;
        }
        return Math.max(1, Math.round(parsed));
      }

      function formatQty(value, unit) {
        var options = isWeightUnit(unit)
          ? { minimumFractionDigits: 2, maximumFractionDigits: 2 }
          : { minimumFractionDigits: 0, maximumFractionDigits: 0 };
        return Number(value || 0).toLocaleString('ar-SA', options);
      }

      function unitLabel(unit) {
        return isWeightUnit(unit) ? 'كغ' : 'قطعة';
      }

      function inputQtyValue(value, unit) {
        if (isWeightUnit(unit)) {
          return (Math.round((Number(value) || 0) * 100) / 100).toFixed(2);
        }
        return String(Math.max(0, Math.round(Number(value) || 0)));
      }

      function applySheetMode() {
        if (!isSheetMode) return;
        document.body.classList.add('cart-sheet-mode');
        if (closeCartButton) closeCartButton.classList.remove('hidden');
        if (notificationButton) notificationButton.classList.add('hidden');
      }
      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function bindLink(link, to) {
        if (!link) return;
        link.href = to;
        link.addEventListener('click', function (event) {
          event.preventDefault();
          send('navigate', { to: to });
        });
      }

      function setLocationStatus(message, isError) {
        if (!locationStatusText) return;
        locationStatusText.textContent = message;
        locationStatusText.classList.toggle('text-red-600', Boolean(isError));
      }

      function hasValidGpsLocation(location) {
        if (!location) return false;
        var lat = Number(location.latitude);
        var lng = Number(location.longitude);
        return Number.isFinite(lat) && Number.isFinite(lng);
      }

      function googleMapsUrlForLocation(location) {
        if (!hasValidGpsLocation(location)) return '';
        var lat = Number(location.latitude).toFixed(7);
        var lng = Number(location.longitude).toFixed(7);
        return 'https://www.google.com/maps?q=' + encodeURIComponent(lat + ',' + lng);
      }

      function openSelectedLocationInMaps() {
        if (!hasValidGpsLocation(state.location)) {
          setLocationStatus('يرجى تحديد موقعك أولاً عبر GPS.', true);
          return;
        }

        var url = googleMapsUrlForLocation(state.location);
        if (!url) return;
        window.open(url, '_blank', 'noopener,noreferrer');
      }

      function applySelectedLocation() {
        if (!selectedLocationLabel) return;
        if (!state.location) {
          selectedLocationLabel.textContent = 'الموقع غير محدد بعد';
          selectedLocationLabel.classList.remove('cursor-pointer', 'underline', 'decoration-dotted', 'text-primary');
          selectedLocationLabel.removeAttribute('title');
          return;
        }

        selectedLocationLabel.textContent =
          'GPS: ' + state.location.latitude.toFixed(6) + ', ' + state.location.longitude.toFixed(6);
        selectedLocationLabel.classList.add('cursor-pointer', 'underline', 'decoration-dotted', 'text-primary');
        selectedLocationLabel.setAttribute('title', 'افتح في خرائط Google');
      }

      function setConfirmLoading(isLoading) {
        state.isCheckoutLoading = Boolean(isLoading);
        if (confirmButton) {
          confirmButton.disabled = state.isCheckoutLoading;
        }
        if (confirmLabel) {
          confirmLabel.textContent = state.isCheckoutLoading ? 'جاري تأكيد الطلب...' : 'تأكيد الطلب';
        }
      }

      function requestLocation() {
        if (!navigator.geolocation) {
          setLocationStatus('متصفحك لا يدعم تحديد الموقع.', true);
          alert('متصفحك لا يدعم تحديد الموقع.');
          return;
        }

        setLocationStatus('جاري تحديد موقعك...', false);

        navigator.geolocation.getCurrentPosition(
          function (position) {
            state.location = {
              latitude: Number(Number(position.coords.latitude).toFixed(7)),
              longitude: Number(Number(position.coords.longitude).toFixed(7)),
            };
            applySelectedLocation();
            setLocationStatus('تم تحديد الموقع بنجاح.', false);
          },
          function (error) {
            state.location = null;
            applySelectedLocation();

            var message = 'تعذر تحديد الموقع. تأكد من تفعيل GPS.';
            if (error && error.code === 1) {
              message = 'تم رفض صلاحية الموقع. يرجى السماح بالوصول للموقع.';
            } else if (error && error.code === 2) {
              message = 'الموقع غير متاح حالياً. حاول مرة أخرى.';
            } else if (error && error.code === 3) {
              message = 'انتهت مهلة تحديد الموقع. حاول مرة أخرى.';
            }

            setLocationStatus(message, true);
            alert(message);
          },
          {
            enableHighAccuracy: true,
            timeout: 12000,
            maximumAge: 0,
          },
        );
      }

      function renderItems(items) {
        if (!itemsContainer) return;

        if (!items.length) {
          itemsContainer.innerHTML =
            '<div class="bg-white organic-card-shape p-6 text-center text-on-surface-variant border border-sky-50">السلة فارغة حالياً. أضف منتجات لعرضها هنا.</div>';
          return;
        }

        itemsContainer.innerHTML = items
          .map(function (item) {
            var itemId = String(item && item.id ? item.id : '');
            var qty = Math.max(0, Number(item && item.qty ? item.qty : 0));
            var price = Math.max(0, Number(item && item.price ? item.price : 0));
            var total = Math.max(0, Number(item && item.total ? item.total : qty * price));
            var unit = String(item && item.unit ? item.unit : '').toUpperCase();
            var step = qtyStep(unit);
            var noteValue = String(state.notesById[itemId] || '');

            state.qtyById[itemId] = qty;
            state.unitById[itemId] = unit;
            state.itemsById[itemId] = item;

            return (
              '<div class="bg-white organic-card-shape p-4 shadow-sm border border-sky-50 space-y-3" data-cart-item="' +
              escapeHtml(itemId) +
              '">' +
              '<div class="flex gap-4 items-start">' +
              '<div class="w-24 h-24 rounded-2xl bg-sky-50 overflow-hidden flex-shrink-0">' +
              (item.imageUrl
                ? '<img class="w-full h-full object-cover" alt="' +
                  escapeHtml(item.name || 'منتج') +
                  '" src="' +
                  escapeHtml(item.imageUrl) +
                  '"/>'
                : '<div class="w-full h-full flex items-center justify-center text-primary/70"><span class="material-symbols-outlined text-3xl">inventory_2</span></div>') +
              '</div>' +
              '<div class="flex-grow min-w-0">' +
              '<div class="flex justify-between items-start mb-1 gap-2">' +
              '<h3 class="font-tajawal font-bold text-lg text-on-surface leading-tight truncate">' +
              escapeHtml(item.name || 'منتج') +
              '</h3>' +
              '<span class="font-bold text-primary whitespace-nowrap">' +
              formatSar(total) +
              '</span>' +
              '</div>' +
              '<p class="text-on-surface-variant text-sm">سعر الوحدة: ' +
              formatSar(price) +
              '</p>' +
              '<p class="text-on-surface-variant text-xs mb-2">الوحدة: ' +
              escapeHtml(unitLabel(unit)) +
              '</p>' +
              '<div class="flex justify-end items-center gap-2">' +
              '<div class="flex items-center gap-2 bg-sky-50 rounded-full px-3 py-1.5 border border-sky-100">' +
              '<button class="text-primary font-bold text-xl leading-none hover:opacity-60 transition-opacity" data-action="minus" data-product-id="' +
              escapeHtml(itemId) +
              '" data-unit="' +
              escapeHtml(unit) +
              '" data-step="' +
              escapeHtml(step) +
              '">-</button>' +
              '<input class="w-20 rounded-full border border-sky-200 bg-white text-center text-sm font-bold px-2 py-1 text-on-surface focus:border-primary focus:ring-0" type="number" min="0" step="' +
              escapeHtml(step) +
              '" value="' +
              escapeHtml(inputQtyValue(qty, unit)) +
              '" data-qty-input="' +
              escapeHtml(itemId) +
              '" data-unit="' +
              escapeHtml(unit) +
              '"/>' +
              '<span class="text-xs text-on-surface-variant min-w-[30px] text-center">' +
              escapeHtml(unitLabel(unit)) +
              '</span>' +
              '<button class="text-primary font-bold text-xl leading-none hover:opacity-60 transition-opacity" data-action="plus" data-product-id="' +
              escapeHtml(itemId) +
              '" data-unit="' +
              escapeHtml(unit) +
              '" data-step="' +
              escapeHtml(step) +
              '">+</button>' +
              '</div>' +
              '</div>' +
              '</div>' +
              '</div>' +
              '<div>' +
              '<label class="block text-xs text-on-surface-variant mb-1">ملاحظة لهذا المنتج</label>' +
              '<textarea class="w-full min-h-[66px] rounded-xl border border-sky-100 bg-sky-50/40 px-3 py-2 text-sm text-on-surface placeholder:text-slate-400 focus:border-primary focus:ring-0" data-note-input="' +
              escapeHtml(itemId) +
              '" placeholder="مثال: بدون فليفلة حارة">' +
              escapeHtml(noteValue) +
              '</textarea>' +
              '</div>' +
              '</div>'
            );
          })
          .join('');
      }

      function applyCartState(payload) {
        applyStore(payload && payload.store ? payload.store : null);
        var items = Array.isArray(payload && payload.items) ? payload.items : [];
        state.qtyById = {};
        state.unitById = {};
        state.itemsById = {};
        state.isAuthenticated = Boolean(payload && payload.isAuthenticated);
        state.itemCount = Math.max(0, Number(payload && payload.itemCount ? payload.itemCount : 0));

        var activeIds = {};
        items.forEach(function (item) {
          var id = String(item && item.id ? item.id : '');
          if (id) activeIds[id] = true;
        });
        Object.keys(state.notesById).forEach(function (id) {
          if (!activeIds[id]) {
            delete state.notesById[id];
          }
        });
        saveNotes();

        renderItems(items);
        if (summaryItemCount) {
          summaryItemCount.textContent = Number(state.itemCount || 0).toLocaleString('ar-SA', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2,
          });
        }
        if (summarySubtotal) {
          summarySubtotal.textContent = formatSar(payload && payload.subtotal ? payload.subtotal : 0);
        }
        if (summaryTotal) {
          summaryTotal.textContent = formatSar(payload && payload.subtotal ? payload.subtotal : 0);
        }

        setFooterCartCount(state.itemCount);
      }

      function getCheckoutPayload() {
        var missing = [];

        if (!state.isAuthenticated) {
          missing.push('تسجيل الدخول');
        }

        if (!state.location) {
          missing.push('موقع GPS');
        }

        if (state.itemCount <= 0) {
          alert('السلة فارغة. أضف منتجات قبل تأكيد الطلب.');
          return null;
        }

        var itemNotes = {};
        Object.keys(state.notesById).forEach(function (productId) {
          if (!state.itemsById[productId]) return;
          var clean = String(state.notesById[productId] || '').trim();
          if (!clean) return;
          itemNotes[productId] = clean.slice(0, 400);
        });

        if (missing.length) {
          alert('يرجى تعبئة الحقول الناقصة: ' + missing.join('، '));
          return null;
        }

        var checkoutPayload = {
          latitude: state.location.latitude,
          longitude: state.location.longitude,
        };
        if (Object.keys(itemNotes).length) {
          checkoutPayload.itemNotes = itemNotes;
        }
        return checkoutPayload;
      }

      function setQty(productId, nextQty) {
        var unit = state.unitById[productId] || '';
        var normalizedQty = normalizeQty(nextQty, unit);
        state.qtyById[productId] = normalizedQty;

        var inputNode = document.querySelector('[data-qty-input="' + productId + '"]');
        if (inputNode) {
          inputNode.value = inputQtyValue(normalizedQty, unit);
        }

        send('set-qty', { id: productId, qty: normalizedQty });
      }

      document.addEventListener('click', function (event) {
        var actionButton = event.target.closest('[data-action][data-product-id]');
        if (!actionButton) return;
        event.preventDefault();

        var productId = actionButton.getAttribute('data-product-id');
        var action = actionButton.getAttribute('data-action');
        var step = Number(actionButton.getAttribute('data-step') || 1);
        if (!productId) return;

        var currentQty = Math.max(0, Number(state.qtyById[productId]) || 0);
        var delta = Number.isFinite(step) && step > 0 ? step : 1;
        var nextQty = action === 'plus' ? currentQty + delta : Math.max(0, currentQty - delta);
        setQty(productId, nextQty);
      });

      document.addEventListener('change', function (event) {
        var qtyInput = event.target.closest('[data-qty-input]');
        if (!qtyInput) return;

        var productId = qtyInput.getAttribute('data-qty-input');
        if (!productId) return;
        setQty(productId, qtyInput.value);
      });

      document.addEventListener('input', function (event) {
        var noteInput = event.target.closest('[data-note-input]');
        if (!noteInput) return;

        var productId = noteInput.getAttribute('data-note-input');
        if (!productId) return;
        var noteValue = String(noteInput.value || '').trim();
        if (noteValue) {
          state.notesById[productId] = noteValue.slice(0, 400);
        } else {
          delete state.notesById[productId];
        }
        saveNotes();
      });

      if (detectLocationButton) {
        detectLocationButton.addEventListener('click', requestLocation);
      }

      if (selectedLocationLabel) {
        selectedLocationLabel.addEventListener('click', function () {
          openSelectedLocationInMaps();
        });

        selectedLocationLabel.addEventListener('keydown', function (event) {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          openSelectedLocationInMaps();
        });
      }

      if (closeCartButton) {
        closeCartButton.addEventListener('click', function () {
          send('navigate', { to: closeRoute || '/home' });
        });
      }

      if (confirmButton) {
        confirmButton.addEventListener('click', function () {
          if (state.isCheckoutLoading) return;

          var checkoutPayload = getCheckoutPayload();
          if (!checkoutPayload) return;

          setConfirmLoading(true);
          send('checkout-order', checkoutPayload);
        });
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;
        var payload = event.data;
        if (!payload || payload.source !== 'react-shell') return;

        if (payload.type === 'cart-state') {
          applyCartState(payload);
          return;
        }

        if (payload.type === 'checkout-result') {
          setConfirmLoading(false);

          if (!payload.success) {
            alert(payload.message || 'تعذر تأكيد الطلب. حاول مرة أخرى.');
            return;
          }

          alert('تم تأكيد الطلب بنجاح.');
          send('navigate', { to: '/orders' });
          return;
        }

        if (payload.type === 'auth-error') {
          setConfirmLoading(false);
          alert(payload.message || 'تعذر إتمام العملية.');
        }
      });

      var navLinks = document.querySelectorAll('nav a');
      var navRoutes = ['/home', '/categories', '/orders', '/cart', '/profile'];
      navLinks.forEach(function (link, index) {
        if (navRoutes[index]) {
          bindLink(link, navRoutes[index]);
        }
      });

      if (window.AlArnabNotifications && typeof window.AlArnabNotifications.mountHeaderButton === 'function') {
        window.AlArnabNotifications.mountHeaderButton('[data-notification-button]');
      }

      applySheetMode();
      applySelectedLocation();
      send('request-state');
    })();
  </script>
</body>
</html>
