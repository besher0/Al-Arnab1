<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/stitch/tailwind/categories.css" />
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Almarai', sans-serif; background: #f0f8ff; }
    h1, h2, h3 { font-family: 'Cairo', sans-serif; }
    html, body { scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; height: 0; }
    .search-shell { box-shadow: 0 12px 26px rgba(26, 54, 93, 0.12); }
  </style>
  <script src="/stitch/stitch-alert.js"></script>
  <script src="/stitch/stitch-notifications.js"></script>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen">
  <header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md flex justify-between items-center px-6 py-4 border-b border-primary/10">
    <div>
      <h1 class="text-on-surface font-black text-2xl tracking-tight">الأقسام</h1>
      <p class="text-xs text-on-surface-variant font-bold">اختر القسم أو ابحث عن منتج</p>
    </div>
    <button data-notification-button class="text-on-surface-variant hover:text-primary transition-colors" type="button">
      <span class="material-symbols-outlined">notifications</span>
    </button>
  </header>

  <main class="pt-24 pb-32 px-6 max-w-2xl mx-auto">
    <section class="mb-8">
      <div class="search-shell flex items-center bg-white rounded-full px-5 py-3 border border-primary/10">
        <button data-category-search-btn class="material-symbols-outlined text-primary" type="button">search</button>
        <input data-category-search-input class="bg-transparent border-none focus:ring-0 w-full text-sm font-label pr-3 text-right text-on-surface" placeholder="ابحث عن منتج من هنا..." type="text"/>
      </div>
    </section>

    <section>
      <div class="grid grid-cols-2 gap-4" data-categories-grid>
        <div class="col-span-2 bg-white rounded-xl p-6 text-center text-sm text-on-surface-variant border border-primary/10">جاري تحميل الأقسام...</div>
      </div>
    </section>
  </main>

  <nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-xl flex justify-around items-center px-2 pt-3 pb-6 rounded-t-[3rem] z-50 shadow-[0_-4px_32px_rgba(0,0,0,0.05)]">
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <span class="material-symbols-outlined" data-icon="home">home</span>
      <span class="font-label text-[11px] font-semibold mt-1">الرئيسية</span>
    </a>
    <a class="flex flex-col items-center justify-center bg-[#87CEEB] text-white rounded-[24px] px-5 py-2" href="#">
      <span class="material-symbols-outlined" data-icon="grid_view" data-weight="fill" style="font-variation-settings: 'FILL' 1;">grid_view</span>
      <span class="font-label text-[11px] font-semibold mt-1">الأقسام</span>
    </a>
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
      <span class="font-label text-[11px] font-semibold mt-1">طلباتي</span>
    </a>
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <div class="relative">
        <span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
        <span class="cart-badge absolute -top-2 -right-2 bg-red-500 text-white text-[9px] min-w-[16px] h-4 px-1 rounded-full border-2 border-white hidden items-center justify-center leading-none">٠</span>
      </div>
      <span class="font-label text-[11px] font-semibold mt-1">السلة</span>
    </a>
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <span class="material-symbols-outlined" data-icon="person">person</span>
      <span class="font-label text-[11px] font-semibold mt-1">حسابي</span>
    </a>
  </nav>

  <script>
    (function () {
      var API_BASE =
        window.__AL_ARNAB_API_BASE__ ||
        (function () {
          try {
            return window.localStorage.getItem('al-arnab-api-base') || '';
          } catch (_error) {
            return '';
          }
        })() ||
        window.location.origin + '/api';

      var STORAGE_CATEGORY = 'al-arnab-selected-category-id';
      var gridNode = document.querySelector('[data-categories-grid]');
      var searchInput = document.querySelector('[data-category-search-input]');
      var searchButton = document.querySelector('[data-category-search-btn]');

      var state = { categories: [] };

      function toArabicNumber(value) {
        var map = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
        return String(value).replace(/[0-9]/g, function (digit) {
          return map[Number(digit)] || digit;
        });
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function send(type, payload) {
        window.parent.postMessage(
          Object.assign({ source: 'stitch-frame', type: type }, payload || {}),
          window.location.origin,
        );
      }

      function bindLink(link, to) {
        if (!link) return;
        link.href = to;
        link.addEventListener('click', function (event) {
          event.preventDefault();
          send('navigate', { to: to });
        });
      }

      function setFooterCartCount(count) {
        var next = Math.max(0, Number(count) || 0);
        var badges = document.querySelectorAll('.cart-badge');
        badges.forEach(function (badge) {
          badge.textContent = toArabicNumber(next);
          badge.style.display = next > 0 ? 'flex' : 'none';
        });
      }

      function renderCategories() {
        if (!gridNode) return;
        if (!state.categories.length) {
          gridNode.innerHTML = '<div class="col-span-2 bg-white rounded-xl p-6 text-center text-sm text-on-surface-variant border border-primary/10">لا توجد أقسام متاحة الآن.</div>';
          return;
        }

        gridNode.innerHTML = state.categories
          .map(function (category) {
            return (
              '<article class="bg-surface-container-lowest rounded-xl p-4 flex flex-col items-center justify-center text-center gap-3 transition-transform active:scale-[0.98] shadow-sm cursor-pointer" data-category-id="' +
              escapeHtml(category.id) +
              '">' +
              '<div class="w-20 h-20 rounded-full overflow-hidden bg-secondary-container/30 flex items-center justify-center">' +
              (category.imageUrl
                ? '<img class="w-full h-full object-cover" alt="' + escapeHtml(category.nameAr || 'قسم') + '" src="' + escapeHtml(category.imageUrl) + '"/>'
                : '<span class="material-symbols-outlined text-primary text-3xl">category</span>') +
              '</div>' +
              '<h3 class="font-bold text-lg text-on-background line-clamp-2">' +
              escapeHtml(category.nameAr || 'قسم') +
              '</h3>' +
              '</article>'
            );
          })
          .join('');
      }

      function openCategory(categoryId) {
        if (!categoryId) return;
        window.localStorage.setItem(STORAGE_CATEGORY, categoryId);
        send('navigate', { to: '/category-products?categoryId=' + encodeURIComponent(categoryId) });
      }

      function openSearchPage() {
        var query = (searchInput && searchInput.value ? searchInput.value : '').trim();
        if (!query) {
          showStitchAlert('اكتب اسم المنتج أولاً.');
          return;
        }
        send('navigate', { to: '/search?q=' + encodeURIComponent(query) + '&from=categories' });
      }

      var navLinks = document.querySelectorAll('nav a');
      var navRoutes = ['/home', '/categories', '/orders', '/cart', '/profile'];
      navLinks.forEach(function (link, index) {
        if (navRoutes[index]) {
          bindLink(link, navRoutes[index]);
        }
      });

      document.addEventListener('click', function (event) {
        var categoryCard = event.target.closest('[data-category-id]');
        if (!categoryCard) return;
        openCategory(categoryCard.getAttribute('data-category-id'));
      });

      if (searchButton) {
        searchButton.addEventListener('click', openSearchPage);
      }

      if (searchInput) {
        searchInput.addEventListener('keydown', function (event) {
          if (event.key !== 'Enter') return;
          event.preventDefault();
          openSearchPage();
        });
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;
        var payload = event.data;
        if (!payload || payload.source !== 'react-shell') return;
        if (payload.type !== 'cart-state') return;
        setFooterCartCount(payload.itemCount || 0);
      });

      renderCategories();

      fetch(API_BASE + '/catalog/categories')
        .then(function (response) {
          if (!response.ok) throw new Error('catalog');
          return response.json();
        })
        .then(function (categories) {
          state.categories = Array.isArray(categories) ? categories : [];
          renderCategories();
        })
        .catch(function () {
          state.categories = [];
          renderCategories();
        });

      if (window.AlArnabNotifications && typeof window.AlArnabNotifications.mountHeaderButton === 'function') {
        window.AlArnabNotifications.mountHeaderButton('[data-notification-button]');
      }

      send('request-state');
    })();
  </script>
</body>
</html>
