<script>
  (function () {
    var API_BASE =
      window.__AL_ARNAB_API_BASE__ ||
      (function () {
        try {
          return window.localStorage.getItem('al-arnab-api-base') || '';
        } catch (error) {
          return '';
        }
      })() ||
      window.location.origin + '/api';
    var STORAGE_CATEGORY = 'al-arnab-selected-category-id';
    var STORAGE_PRODUCT = 'al-arnab-selected-product-id';
    var categoryNameNode = document.querySelector('nav .font-bold.text-primary');
    var headerTitleNode = document.querySelector('h2.font-tajawal.font-extrabold');
    var productsGrid = document.querySelector('[data-category-products-grid]');
    var quickCartBadge = document.querySelector('.fixed.bottom-28 .absolute');
    var state = {
      categories: [],
      products: [],
      selectedCategoryId: '',
      qtyByProduct: {},
      currency: 'SYP',
    };
    var routeSelectedCategoryId = '';

    function toArabicNumber(value) {
      var map = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
      return String(value).replace(/[0-9]/g, function (digit) {
        return map[Number(digit)] || digit;
      });
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function readCategoryIdFromSearch(searchValue) {
      var raw = String(searchValue || '').trim();
      if (!raw) return '';
      var search = raw.charAt(0) === '?' ? raw.slice(1) : raw;
      var params = new URLSearchParams(search);
      return (params.get('categoryId') || params.get('category') || '').trim();
    }

    function applyRouteCategorySelection(searchValue) {
      var fromRoute = readCategoryIdFromSearch(searchValue);
      if (!fromRoute) return;

      routeSelectedCategoryId = fromRoute;
      window.localStorage.setItem(STORAGE_CATEGORY, fromRoute);

      if (!state.categories.length) return;
      var exists = state.categories.some(function (category) {
        return category.id === fromRoute;
      });
      if (!exists) return;

      if (state.selectedCategoryId !== fromRoute) {
        state.selectedCategoryId = fromRoute;
        renderHeader();
        renderProducts();
        refreshAllQuantities();
      }
    }
    function currencyLabel(currency) {
      var code = String(currency || '').toUpperCase();
      if (code === 'SAR') return 'ر.س';
      if (code === 'SYP') return 'ل.س';
      return code || 'ل.س';
    }

    function applyStore(storePayload) {
      if (!storePayload || typeof storePayload !== 'object') return;
      state.currency = String(storePayload.currency || state.currency || 'SYP').toUpperCase();
    }

    function formatSar(value) {
      return (Math.max(0, Number(value) || 0)).toFixed(2) + ' ' + currencyLabel(state.currency);
    }
    function setCartCount(count) {
      var badge = quickCartBadge;
      if (!badge) return;

      var next = Math.max(0, Number(count) || 0);
      badge.textContent = toArabicNumber(next);
      badge.style.display = next > 0 ? 'flex' : 'none';
    }

    function setFooterCartCount(count) {
      var next = Math.max(0, Number(count) || 0);
      var badges = document.querySelectorAll('.cart-badge');
      badges.forEach(function (badge) {
        badge.textContent = toArabicNumber(next);
        badge.style.display = next > 0 ? 'flex' : 'none';
      });
    }

    function setQtyInUi(productId, qty) {
      var qtyNodes = document.querySelectorAll('[data-qty-for="' + productId + '"]');
      qtyNodes.forEach(function (node) {
        node.textContent = toArabicNumber(Math.max(0, Number(qty) || 0));
      });
    }

    function refreshAllQuantities() {
      Object.keys(state.qtyByProduct).forEach(function (productId) {
        setQtyInUi(productId, state.qtyByProduct[productId]);
      });
    }

    function getCategoryLabel(categoryId) {
      var category = state.categories.find(function (item) {
        return item.id === categoryId;
      });
      return category ? category.nameAr : 'التصنيف';
    }

    function hasActiveOffer(product) {
      if (!product || typeof product !== 'object') return false;
      var hasDiscount = product.hasDiscount;
      if (hasDiscount === true || hasDiscount === 1 || hasDiscount === 'true') return true;
      var original = Math.max(0, Number(product.originalPrice || 0));
      var finalPrice = Math.max(0, Number(product.price || 0));
      return original > finalPrice && finalPrice > 0;
    }

    function offerBadgeLabel(product) {
      var discount = product && product.discount ? product.discount : null;
      if (!discount) return 'عرض';
      var type = String(discount.type || '').toUpperCase();
      var value = Math.max(0, Number(discount.value || 0));
      if (type === 'PERCENT') {
        return 'خصم ' + value + '%';
      }
      return 'خصم ' + formatSar(value);
    }

    function renderHeader() {
      var label = getCategoryLabel(state.selectedCategoryId);
      if (categoryNameNode) categoryNameNode.textContent = label;
      if (headerTitleNode) headerTitleNode.textContent = label;
    }

    function renderProducts() {
      if (!productsGrid) return;

      var filtered = state.products.filter(function (product) {
        if (!state.selectedCategoryId) return true;
        return product.categoryId === state.selectedCategoryId;
      });

      if (!filtered.length) {
        productsGrid.innerHTML =
          '<div class="col-span-full bg-surface-container-lowest rounded-2xl p-6 text-center text-sm text-on-surface-variant border border-outline/10">لا توجد منتجات في هذا التصنيف حالياً.</div>';
        return;
      }

      productsGrid.innerHTML = filtered
        .map(function (product) {
          var qty = Math.max(0, Number(state.qtyByProduct[product.id]) || 0);
          var finalPrice = Math.max(0, Number(product && product.price ? product.price : 0));
          var originalPrice = Math.max(0, Number(product && product.originalPrice ? product.originalPrice : 0));
          var showOriginalPrice = originalPrice > finalPrice && finalPrice > 0;
          var hasOffer = hasActiveOffer(product);

          return (
            '<div class="product-card bg-surface-container-lowest rounded-2xl overflow-hidden flex flex-col shadow-sm border border-outline/5" data-open-product="' +
            escapeHtml(product.id) +
            '">' +
            '<div class="h-32 overflow-hidden relative">' +
            (hasOffer
              ? '<div class="offer-badge absolute top-2 right-2">' + escapeHtml(offerBadgeLabel(product)) + '</div>'
              : '') +
            (product.imageUrl
              ? '<img class="w-full h-full object-cover" alt="' +
                escapeHtml(product.name || 'منتج') +
                '" src="' +
                escapeHtml(product.imageUrl) +
                '"/>'
              : '<div class="w-full h-full flex items-center justify-center text-primary/60 bg-surface-container"><span class="material-symbols-outlined text-3xl">inventory_2</span></div>') +
            '</div>' +
            '<div class="p-3 flex flex-col flex-grow product-card-body">' +
            '<h3 class="font-tajawal font-bold text-sm line-clamp-2 min-h-[2.5rem]">' +
            escapeHtml(product.name || 'منتج') +
            '</h3>' +
            '<span class="text-tertiary-dim text-[10px] font-bold mt-0.5">' +
            escapeHtml(product.unit || '') +
            '</span>' +
            '<div class="price-row">' +
            '<span class="text-lg font-black text-primary block">' +
            formatSar(finalPrice) +
            '</span>' +
            (showOriginalPrice
              ? '<span class="price-before">' + formatSar(originalPrice) + '</span>'
              : '') +
            '</div>' +
            '<div class="mt-auto space-y-2">' +
            '<div class="qty-control">' +
            '<button class="qty-btn text-primary hover:bg-primary-container transition-colors" data-action="minus" data-product-id="' +
            escapeHtml(product.id) +
            '">' +
            '<span class="material-symbols-outlined text-sm">remove</span></button>' +
            '<span class="qty-value text-xs" data-qty-for="' +
            escapeHtml(product.id) +
            '">' +
            toArabicNumber(qty) +
            '</span>' +
            '<button class="qty-btn text-primary hover:bg-primary-container transition-colors" data-action="plus" data-product-id="' +
            escapeHtml(product.id) +
            '">' +
            '<span class="material-symbols-outlined text-sm">add</span></button>' +
            '</div>' +
            '<button class="add-btn w-full bg-secondary-container text-on-secondary-container text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-1 active:scale-95 transition-transform" data-action="add" data-product-id="' +
            escapeHtml(product.id) +
            '">' +
            '<span class="material-symbols-outlined text-base">shopping_basket</span>أضف</button>' +
            '</div>' +
            '</div>' +
            '</div>'
          );
        })
        .join('');
    }

    function send(type, payload) {
      window.parent.postMessage(
        Object.assign({ source: 'stitch-frame', type: type }, payload || {}),
        window.location.origin,
      );
    }

    function bindLink(link, to) {
      if (!link) return;
      link.href = to;
      link.addEventListener('click', function (event) {
        event.preventDefault();
        send('navigate', { to: to });
      });
    }

    var navLinks = document.querySelectorAll('nav a');
    var navRoutes = ['/home', '/categories', '/orders', '/cart', '/profile'];
    navLinks.forEach(function (link, index) {
      if (navRoutes[index]) {
        bindLink(link, navRoutes[index]);
      }
    });

    var quickCart = Array.from(document.querySelectorAll('button')).find(function (btn) {
      var icon = btn.querySelector('.material-symbols-outlined');
      return icon && icon.textContent.trim() === 'shopping_bag';
    });
    if (quickCart) {
      quickCart.addEventListener('click', function () {
        send('navigate', { to: '/cart' });
      });
    }

    document.addEventListener('click', function (event) {
      var actionButton = event.target.closest('[data-action][data-product-id]');
      if (actionButton) {
        event.preventDefault();
        event.stopPropagation();
        var productId = actionButton.getAttribute('data-product-id');
        var action = actionButton.getAttribute('data-action');
        if (!productId) return;

        var currentQty = Math.max(0, Number(state.qtyByProduct[productId]) || 0);
        if (action === 'add' || action === 'plus') {
          var nextPlus = currentQty + 1;
          state.qtyByProduct[productId] = nextPlus;
          setQtyInUi(productId, nextPlus);
          send('add-item', { id: productId, qty: 1 });
          return;
        }

        if (action === 'minus') {
          var nextMinus = Math.max(0, currentQty - 1);
          state.qtyByProduct[productId] = nextMinus;
          setQtyInUi(productId, nextMinus);
          send('set-qty', { id: productId, qty: nextMinus });
        }
        return;
      }

      var card = event.target.closest('[data-open-product]');
      if (!card) return;
      var productId = card.getAttribute('data-open-product');
      if (!productId) return;
      window.localStorage.setItem(STORAGE_PRODUCT, productId);
      send('navigate', { to: '/product' });
    });

    function applyBootstrap(payload) {
      state.categories = Array.isArray(payload && payload.categories) ? payload.categories : [];
      state.products = Array.isArray(payload && payload.products) ? payload.products : [];

      var savedCategory =
        routeSelectedCategoryId || window.localStorage.getItem(STORAGE_CATEGORY) || '';
      var hasSaved = state.categories.some(function (category) {
        return category.id === savedCategory;
      });
      state.selectedCategoryId = hasSaved
        ? savedCategory
        : (state.categories[0] && state.categories[0].id) || '';

      if (state.selectedCategoryId) {
        window.localStorage.setItem(STORAGE_CATEGORY, state.selectedCategoryId);
      }

      renderHeader();
      renderProducts();
      refreshAllQuantities();
    }

    window.addEventListener('message', function (event) {
      if (event.origin !== window.location.origin) return;
      var payload = event.data;
      if (!payload || payload.source !== 'react-shell') return;
      if (payload.type !== 'cart-state') return;

      applyStore(payload.store || null);

      if (payload.route && payload.route.pathname === '/category-products') {
        applyRouteCategorySelection(payload.route.search || '');
      }

      var items = Array.isArray(payload.items) ? payload.items : [];
      state.qtyByProduct = {};
      items.forEach(function (item) {
        var id = String(item && item.id ? item.id : '');
        if (!id) return;
        state.qtyByProduct[id] = Math.max(0, Number(item.qty) || 0);
      });

      refreshAllQuantities();
      setCartCount(payload.itemCount || 0);
      renderProducts();
      setFooterCartCount(payload.itemCount || 0);
    });

    renderHeader();
    renderProducts();
    applyRouteCategorySelection(window.location.search);

    fetch(API_BASE + '/catalog/bootstrap')
      .then(function (response) {
        if (!response.ok) {
          throw new Error('catalog');
        }
        return response.json();
      })
      .then(function (payload) {
        applyStore(payload && payload.store ? payload.store : null);
        applyBootstrap(payload || {});
      })
      .catch(function () {
        state.categories = [];
        state.products = [];
        renderHeader();
        renderProducts();
      });

    if (window.AlArnabNotifications && typeof window.AlArnabNotifications.mountHeaderButton === 'function') {
      window.AlArnabNotifications.mountHeaderButton('[data-notification-button]');
    }

    send('request-state');
  })();
</script>
</body></html>
