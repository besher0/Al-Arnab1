<body class="bg-background text-on-surface font-body h-screen overflow-hidden flex items-center justify-center p-4">
  <div class="fixed -top-24 -right-20 w-72 h-72 bg-primary/30 rounded-full blur-3xl"></div>
  <div class="fixed -bottom-24 -left-16 w-80 h-80 bg-primary/20 rounded-full blur-3xl"></div>

  <section class="login-shell w-full max-w-md relative z-10">
    <header class="text-center mb-7">
      <div class="inline-flex w-20 h-20 rounded-3xl bg-white items-center justify-center shadow-sm border border-border mb-4">
        <span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">pets</span>
      </div>
      <h1 class="font-headline font-black text-4xl text-on-surface">Al-Arnab</h1>
      <p class="text-on-surface-variant mt-2">تسجيل الدخول إلى حسابك</p>
    </header>

    <div class="bg-surface border border-border rounded-[28px] p-6 shadow-[0_14px_40px_rgba(26,54,93,0.09)]">
      <h2 class="font-headline font-extrabold text-2xl mb-6">أهلًا بعودتك</h2>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="login-phone" class="block text-sm font-bold text-on-surface-variant mb-2">رقم الهاتف</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant">call</span>
            <input id="login-phone" type="tel" placeholder="05xxxxxxxx" class="w-full h-12 rounded-full border border-border bg-white pr-12 pl-4 text-on-surface focus:ring-2 focus:ring-primary/30 focus:border-primary" />
          </div>
        </div>

        <div>
          <label for="login-password" class="block text-sm font-bold text-on-surface-variant mb-2">كلمة المرور</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
            <input id="login-password" type="password" placeholder="••••••••" class="w-full h-12 rounded-full border border-border bg-white pr-12 pl-12 text-on-surface focus:ring-2 focus:ring-primary/30 focus:border-primary" />
            <button type="button" data-password-toggle="login-password" class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">
              <span class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </div>

        <button type="submit" class="w-full h-12 rounded-full bg-primary text-on-primary font-headline font-bold text-lg shadow-md shadow-sky-200 hover:opacity-90 transition-all">
          تسجيل الدخول
        </button>
      </form>

      <p class="text-center text-sm text-on-surface-variant mt-6">
        ليس لديك حساب؟
        <a id="go-signup" href="/signup" class="font-extrabold text-on-surface hover:underline">إنشاء حساب</a>
      </p>
    </div>
  </section>

  <script>
    (function () {
      function send(type, payload) {
        window.parent.postMessage(
          Object.assign({ source: 'stitch-frame', type: type }, payload || {}),
          window.location.origin,
        );
      }

      var signupLink = document.getElementById('go-signup');
      if (signupLink) {
        signupLink.addEventListener('click', function (event) {
          event.preventDefault();
          send('navigate', { to: '/signup' });
        });
      }

      var form = document.getElementById('login-form');
      var phoneInput = document.getElementById('login-phone');

      var toggles = document.querySelectorAll('[data-password-toggle]');
      toggles.forEach(function (button) {
        button.addEventListener('click', function () {
          var inputId = button.getAttribute('data-password-toggle');
          if (!inputId) return;

          var input = document.getElementById(inputId);
          if (!input) return;

          var hidden = input.type === 'password';
          input.type = hidden ? 'text' : 'password';

          var icon = button.querySelector('.material-symbols-outlined');
          if (icon) {
            icon.textContent = hidden ? 'visibility_off' : 'visibility';
          }
        });
      });

      if (form) {
        form.addEventListener('submit', function (event) {
          event.preventDefault();

          var phone = String(phoneInput && phoneInput.value ? phoneInput.value : '').trim();
          if (!phone) {
            alert('رقم الهاتف مطلوب.');
            return;
          }

          send('auth-login', { phone: phone });
        });
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;

        var payload = event.data;
        if (!payload || payload.source !== 'react-shell') return;
        if (payload.type !== 'auth-error') return;

        alert(payload.message || 'تعذر تسجيل الدخول.');
      });
    })();
  </script>
</body>
