<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/stitch/tailwind/orders.css" />
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    html,
    body {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
    }
  </style>
  <script src="/stitch/stitch-alert.js"></script>
  <script src="/stitch/stitch-notifications.js"></script>
</head>
<body class="bg-background font-body text-on-surface antialiased pb-32">
  <header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md flex justify-between items-center px-6 py-4 border-b border-primary/10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white shadow-sm">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pets</span>
      </div>
      <h1 class="text-on-surface font-['Tajawal'] font-bold text-2xl tracking-tight">الأرنب</h1>
    </div>
    <div class="flex items-center gap-2">
      <button data-notification-button class="text-on-surface-variant hover:text-primary transition-colors" type="button">
        <span class="material-symbols-outlined">notifications</span>
      </button>
    </div>
  </header>

  <main class="pt-24 px-4 max-w-2xl mx-auto">
    <div class="mb-8 relative">
      <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
        <span class="material-symbols-outlined text-on-surface-variant">search</span>
      </div>
      <input id="orders-search-input" class="w-full h-14 bg-surface-container-lowest rounded-full pr-12 pl-6 border-none shadow-sm focus:ring-2 focus:ring-primary text-on-surface" placeholder="ابحث في طلباتك..." type="text" />
    </div>

    <section class="mb-8">
      <div class="flex items-center justify-between mb-4 px-2">
        <h2 class="font-headline text-2xl font-black text-on-background">الطلبات الحالية</h2>
        <span id="current-orders-badge" class="bg-surface-container text-on-surface px-3 py-1 rounded-full text-xs font-bold">0 نشط</span>
      </div>
      <div id="current-order-card" class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)]"></div>
    </section>

    <section>
      <div class="flex items-center justify-between mb-4 px-2">
        <h2 class="font-headline text-2xl font-black text-on-background">سجل الطلبات</h2>
      </div>
      <div id="orders-history-list" class="space-y-3"></div>
    </section>
  </main>

  <div id="order-details-modal" class="fixed inset-0 z-[70] hidden">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px]" data-close-order-modal="true"></div>
    <div class="relative h-full w-full flex items-end justify-center p-3 sm:p-5">
      <section class="w-full max-w-2xl bg-white rounded-3xl shadow-[0_20px_50px_rgba(26,54,93,0.24)] max-h-[86vh] overflow-hidden">
        <header class="flex items-center justify-between px-5 py-4 border-b border-primary/10">
          <h3 id="order-details-title" class="font-headline font-extrabold text-lg text-on-surface">تفاصيل الطلب</h3>
          <button type="button" class="w-9 h-9 rounded-full bg-surface-container text-on-surface flex items-center justify-center" data-close-order-modal="true">
            <span class="material-symbols-outlined text-[20px]">close</span>
          </button>
        </header>
        <div id="order-details-body" class="p-5 overflow-y-auto max-h-[calc(86vh-74px)]"></div>
      </section>
    </div>
  </div>

  <nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-xl flex justify-around items-center px-2 pt-3 pb-6 rounded-t-[3rem] z-50 shadow-[0_-4px_32px_rgba(0,0,0,0.05)]">
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <span class="material-symbols-outlined" data-icon="home">home</span>
      <span class="font-label text-[11px] font-semibold mt-1">الرئيسية</span>
    </a>
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <span class="material-symbols-outlined" data-icon="grid_view">grid_view</span>
      <span class="font-label text-[11px] font-semibold mt-1">الأقسام</span>
    </a>
    <a class="flex flex-col items-center justify-center bg-[#87CEEB] text-white rounded-[24px] px-5 py-2" href="#">
      <span class="material-symbols-outlined" data-icon="receipt_long" data-weight="fill" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
      <span class="font-label text-[11px] font-semibold mt-1">طلباتي</span>
    </a>
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <div class="relative">
        <span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
        <span class="cart-badge absolute -top-2 -right-2 bg-red-500 text-white text-[9px] min-w-[16px] h-4 px-1 rounded-full border-2 border-white hidden items-center justify-center leading-none">٠</span>
      </div>
      <span class="font-label text-[11px] font-semibold mt-1">السلة</span>
    </a>
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <span class="material-symbols-outlined" data-icon="person">person</span>
      <span class="font-label text-[11px] font-semibold mt-1">حسابي</span>
    </a>
  </nav>

  <script>
    (function () {
      var currentBadge = document.getElementById('current-orders-badge');
      var currentCard = document.getElementById('current-order-card');
      var historyList = document.getElementById('orders-history-list');
      var searchInput = document.getElementById('orders-search-input');
      var orderDetailsModal = document.getElementById('order-details-modal');
      var orderDetailsBody = document.getElementById('order-details-body');
      var orderDetailsTitle = document.getElementById('order-details-title');

      var state = {
        cartCount: 0,
        orders: [],
        currency: 'SYP',
      };

      function send(type, payload) {
        window.parent.postMessage(
          Object.assign({ source: 'stitch-frame', type: type }, payload || {}),
          window.location.origin,
        );
      }

      function toArabicNumber(value) {
        var map = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
        return String(value).replace(/[0-9]/g, function (digit) {
          return map[Number(digit)] || digit;
        });
      }
      function currencyLabel() {
      return 'ل.س';
    }

    function applyStore(storePayload) {
      if (!storePayload || typeof storePayload !== 'object') return;
      state.currency = String(storePayload.currency || state.currency || 'SYP').toUpperCase();
    }

    function formatSar(value) {
      return (Math.max(0, Number(value) || 0)).toFixed(2) + ' ' + currencyLabel(state.currency);
    }
      function formatDate(value) {
        if (!value) return '-';
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) return '-';
        return new Intl.DateTimeFormat('ar', {
          day: '2-digit',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        }).format(date);
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function statusLabel(status) {
        var map = {
          NEW: 'جديد',
          PREPARING: 'قيد التحضير',
          ON_THE_WAY: 'في الطريق',
          DELIVERED: 'تم التوصيل',
          REJECTED: 'مرفوض',
          CANCELLED: 'ملغي',
        };
        return map[status] || status || '-';
      }

      function statusColor(status) {
        if (status === 'DELIVERED') return 'text-emerald-700';
        if (status === 'REJECTED' || status === 'CANCELLED') return 'text-red-700';
        if (status === 'ON_THE_WAY') return 'text-primary';
        if (status === 'PREPARING') return 'text-amber-700';
        return 'text-on-surface';
      }

      function activeStatuses() {
        return ['NEW', 'PREPARING', 'ON_THE_WAY'];
      }

      function statusBadgeClass(status) {
        if (status === 'DELIVERED') return 'bg-emerald-100 text-emerald-700';
        if (status === 'REJECTED' || status === 'CANCELLED') return 'bg-red-100 text-red-700';
        if (status === 'ON_THE_WAY') return 'bg-sky-100 text-sky-700';
        if (status === 'PREPARING') return 'bg-amber-100 text-amber-700';
        return 'bg-surface-container text-on-surface';
      }

      function setFooterCartCount(count) {
        var next = Math.max(0, Number(count) || 0);
        var badges = document.querySelectorAll('.cart-badge');
        badges.forEach(function (badge) {
          badge.textContent = toArabicNumber(next);
          badge.style.display = next > 0 ? 'flex' : 'none';
        });
      }

      function bindLink(link, to) {
        if (!link) return;
        link.href = to;
        link.addEventListener('click', function (event) {
          event.preventDefault();
          send('navigate', { to: to });
        });
      }

      function findOrderById(orderId) {
        if (!orderId) return null;
        for (var i = 0; i < state.orders.length; i += 1) {
          if (String(state.orders[i].id || '') === String(orderId)) {
            return state.orders[i];
          }
        }
        return null;
      }

      function orderLocationText(order) {
        if (!order || !order.location) return 'الموقع غير متوفر';

        var lat = Number(order.location.latitude);
        var lng = Number(order.location.longitude);
        if (Number.isFinite(lat) && Number.isFinite(lng)) {
          return 'GPS: ' + lat.toFixed(6) + ', ' + lng.toFixed(6);
        }

        var city = order.location.city ? String(order.location.city) : '';
        var street = order.location.street ? String(order.location.street) : '';
        var combined = [city, street].filter(Boolean).join(' - ');
        return combined || 'الموقع غير متوفر';
      }

      function orderLocationCoordinates(order) {
        if (!order || !order.location) return null;

        var lat = Number(order.location.latitude);
        var lng = Number(order.location.longitude);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;

        return {
          latitude: Number(lat.toFixed(7)),
          longitude: Number(lng.toFixed(7)),
        };
      }

      function googleMapsUrl(latitude, longitude) {
        return 'https://www.google.com/maps?q=' + encodeURIComponent(String(latitude) + ',' + String(longitude));
      }

      function orderMapLinkHtml(order, extraClass) {
        var coordinates = orderLocationCoordinates(order);
        if (!coordinates) return '';

        var className = 'inline-flex items-center gap-1 text-xs font-bold text-primary hover:underline';
        if (extraClass) {
          className += ' ' + String(extraClass);
        }

        return (
          '<a href="' +
          escapeHtml(googleMapsUrl(coordinates.latitude, coordinates.longitude)) +
          '" target="_blank" rel="noopener noreferrer" class="' +
          escapeHtml(className) +
          '">فتح الموقع على Google Maps</a>'
        );
      }

      function openOrderDetails(order) {
        if (!order || !orderDetailsModal || !orderDetailsBody) return;

        var total = Number(order && order.totals ? order.totals.total : 0) || 0;
        var subtotal = Number(order && order.totals ? order.totals.subtotal : 0) || 0;
        var itemCount = Number(order && order.itemCount ? order.itemCount : 0) || 0;
        var items = Array.isArray(order.items) ? order.items : [];

        if (orderDetailsTitle) {
          orderDetailsTitle.textContent = 'تفاصيل الطلب #' + String(order.orderNumber || '-');
        }

        orderDetailsBody.innerHTML =
          '<div class="space-y-4">' +
          '<div class="bg-surface-container-low rounded-2xl p-4 space-y-2">' +
          '<div class="flex items-center justify-between gap-2">' +
          '<p class="text-sm text-on-surface-variant">حالة الطلب</p>' +
          '<span class="text-xs font-bold px-3 py-1 rounded-full ' + statusBadgeClass(order.status) + '">' +
          escapeHtml(statusLabel(order.status)) +
          '</span>' +
          '</div>' +
          '<div class="flex items-center justify-between gap-2">' +
          '<p class="text-sm text-on-surface-variant">تاريخ الطلب</p>' +
          '<p class="text-sm font-bold">' + escapeHtml(formatDate(order.createdAt)) + '</p>' +
          '</div>' +
          '<div class="flex items-center justify-between gap-2">' +
          '<p class="text-sm text-on-surface-variant">عدد الأصناف</p>' +
          '<p class="text-sm font-bold">' + escapeHtml(toArabicNumber(itemCount)) + '</p>' +
          '</div>' +
          '<div class="flex items-center justify-between gap-2">' +
          '<p class="text-sm text-on-surface-variant">الإجمالي</p>' +
          '<p class="text-base font-black text-primary">' + escapeHtml(formatSar(total)) + '</p>' +
          '</div>' +
          '</div>' +
          '<div class="bg-surface-container-low rounded-2xl p-4">' +
          '<p class="text-sm text-on-surface-variant mb-2">معلومات التوصيل</p>' +
          '<p class="text-sm font-bold">رقم التواصل: ' + escapeHtml(order.alternatePhone || '-') + '</p>' +
          '<p class="text-xs text-on-surface-variant mt-1">' + escapeHtml(orderLocationText(order)) + '</p>' +
          orderMapLinkHtml(order, 'mt-2') +
          '</div>' +
          '<div class="space-y-2">' +
          '<p class="text-sm font-bold text-on-surface">عناصر الطلب</p>' +
          (items.length
            ? items
                .map(function (item) {
                  var lineTotal = Number(item && item.lineTotal ? item.lineTotal : 0) || 0;
                  var qty = Number(item && item.qty ? item.qty : 0) || 0;
                  return (
                    '<div class="bg-surface-container-lowest border border-primary/10 rounded-xl p-3 flex items-center justify-between gap-3">' +
                    '<div class="min-w-0">' +
                    '<p class="font-bold truncate">' + escapeHtml(item && item.name ? item.name : 'منتج') + '</p>' +
                    '<p class="text-xs text-on-surface-variant mt-1">' + escapeHtml(toArabicNumber(qty)) + ' × ' + escapeHtml(formatSar(item && item.unitPrice ? item.unitPrice : 0)) + '</p>' +
                    '</div>' +
                    '<p class="font-black text-sm text-on-background">' + escapeHtml(formatSar(lineTotal)) + '</p>' +
                    '</div>'
                  );
                })
                .join('')
            : '<div class="bg-surface-container-low rounded-xl p-4 text-sm text-on-surface-variant text-center">لا يوجد عناصر مسجلة لهذا الطلب.</div>') +
          '</div>' +
          '<div class="bg-surface-container-low rounded-2xl p-4 text-xs text-on-surface-variant">' +
          '<p class="flex items-center justify-between"><span>المجموع الفرعي</span><strong class="text-on-surface">' + escapeHtml(formatSar(subtotal)) + '</strong></p>' +
          '<p class="flex items-center justify-between mt-1"><span>الخصم</span><strong class="text-on-surface">' + escapeHtml(formatSar(order && order.totals ? order.totals.discountTotal : 0)) + '</strong></p>' +
          '<p class="flex items-center justify-between mt-1"><span>التوصيل</span><strong class="text-on-surface">' + escapeHtml(formatSar(order && order.totals ? order.totals.deliveryFee : 0)) + '</strong></p>' +
          '</div>' +
          '</div>';

        orderDetailsModal.classList.remove('hidden');
      }

      function closeOrderDetails() {
        if (!orderDetailsModal) return;
        orderDetailsModal.classList.add('hidden');
      }

      function orderMatchesFilter(order, query) {
        if (!query) return true;
        var normalized = query.toLowerCase();
        return (
          String(order.orderNumber || '').toLowerCase().indexOf(normalized) !== -1 ||
          String(statusLabel(order.status) || '').toLowerCase().indexOf(normalized) !== -1
        );
      }

      function renderEmptyState() {
        closeOrderDetails();

        if (currentBadge) {
          currentBadge.textContent = '0 نشط';
        }

        if (currentCard) {
          currentCard.innerHTML =
            '<div class="py-8 text-center">' +
            '<div class="w-16 h-16 mx-auto rounded-full bg-surface-container flex items-center justify-center mb-4">' +
            '<span class="material-symbols-outlined text-primary text-3xl">receipt_long</span>' +
            '</div>' +
            '<h3 class="font-headline font-bold text-lg mb-2">لا يوجد طلبات حالية</h3>' +
            '<p class="text-sm text-on-surface-variant">عند تأكيد طلب جديد سيظهر هنا.</p>' +
            (state.cartCount > 0
              ? '<button class="mt-4 text-primary text-sm font-bold bg-surface-container px-4 py-2 rounded-full" data-go-cart="true">مراجعة السلة</button>'
              : '') +
            '</div>';
        }

        if (historyList) {
          historyList.innerHTML =
            '<div class="bg-surface-container-low rounded-xl p-6 text-center text-on-surface-variant">' +
            '<span class="material-symbols-outlined text-3xl text-primary/70 mb-2 block">history</span>' +
            '<p class="text-sm">لا يوجد سجل طلبات بعد.</p>' +
            '</div>';
        }
      }

      function renderCurrentOrderCard(order) {
        if (!currentCard) return;

        var total = Number(order && order.totals ? order.totals.total : 0) || 0;
        var itemCount = Number(order && order.itemCount ? order.itemCount : 0) || 0;
        var locationText = orderLocationText(order);
        var mapLinkHtml = orderMapLinkHtml(order);

        currentCard.innerHTML =
          '<div class="space-y-2">' +
          '<button type="button" class="w-full text-right space-y-4 transition-transform hover:scale-[0.995] active:scale-[0.99]" data-order-id="' + escapeHtml(order.id || '') + '">' +
          '<div class="flex justify-between items-start gap-3">' +
          '<div>' +
          '<h3 class="font-headline font-extrabold text-lg">#' + escapeHtml(order.orderNumber || '-') + '</h3>' +
          '<p class="text-sm ' + statusColor(order.status) + ' font-bold mt-1">' + escapeHtml(statusLabel(order.status)) + '</p>' +
          '<p class="text-xs text-on-surface-variant mt-1">' + escapeHtml(formatDate(order.createdAt)) + '</p>' +
          '</div>' +
          '<div class="text-left">' +
          '<p class="text-primary font-black text-xl">' + escapeHtml(formatSar(total)) + '</p>' +
          '<p class="text-xs text-on-surface-variant mt-1">' + escapeHtml(toArabicNumber(itemCount)) + ' صنف</p>' +
          '</div>' +
          '</div>' +
          '<div class="bg-surface-container rounded-xl p-3 text-xs text-on-surface-variant">' +
          '<p class="font-bold">رقم التواصل: ' + escapeHtml(order.alternatePhone || '-') + '</p>' +
          '<p class="mt-1">' + escapeHtml(locationText) + '</p>' +
          '</div>' +
          '<p class="text-[11px] text-primary font-bold">اضغط لعرض تفاصيل الطلب</p>' +
          '</button>' +
          (mapLinkHtml ? '<div class="px-1">' + mapLinkHtml + '</div>' : '') +
          '</div>';
      }

      function renderHistoryList(orders) {
        if (!historyList) return;

        if (!orders.length) {
          historyList.innerHTML =
            '<div class="bg-surface-container-low rounded-xl p-6 text-center text-on-surface-variant">' +
            '<span class="material-symbols-outlined text-3xl text-primary/70 mb-2 block">history</span>' +
            '<p class="text-sm">لا يوجد سجل طلبات مطابق للبحث.</p>' +
            '</div>';
          return;
        }

        historyList.innerHTML = orders
          .map(function (order) {
            var total = Number(order && order.totals ? order.totals.total : 0) || 0;
            var itemCount = Number(order && order.itemCount ? order.itemCount : 0) || 0;
            return (
              '<button type="button" class="w-full text-right bg-surface-container-low rounded-xl p-4 flex items-center justify-between gap-3 transition-transform hover:scale-[0.995] active:scale-[0.99]" data-order-id="' + escapeHtml(order.id || '') + '">' +
              '<div class="min-w-0">' +
              '<h4 class="font-bold text-on-surface truncate">#' + escapeHtml(order.orderNumber || '-') + '</h4>' +
              '<p class="text-on-surface-variant text-xs mt-0.5">' + escapeHtml(formatDate(order.createdAt)) + '</p>' +
              '<p class="text-[11px] font-bold mt-1 ' + statusColor(order.status) + '">' + escapeHtml(statusLabel(order.status)) + '</p>' +
              '</div>' +
              '<div class="text-left flex-shrink-0">' +
              '<p class="font-black text-on-background">' + escapeHtml(formatSar(total)) + '</p>' +
              '<p class="text-[10px] text-on-surface-variant mt-1">' + escapeHtml(toArabicNumber(itemCount)) + ' صنف</p>' +
              '</div>' +
              '</button>'
            );
          })
          .join('');
      }

      function renderOrders() {
        var query = searchInput && searchInput.value ? String(searchInput.value).trim() : '';
        var filtered = state.orders.filter(function (order) {
          return orderMatchesFilter(order, query);
        });

        if (!filtered.length) {
          renderEmptyState();
          return;
        }

        var activeSet = activeStatuses();
        var activeOrders = filtered.filter(function (order) {
          return activeSet.indexOf(order.status) !== -1;
        });
        var historyOrders = filtered.filter(function (order) {
          return activeSet.indexOf(order.status) === -1;
        });

        if (currentBadge) {
          currentBadge.textContent = toArabicNumber(activeOrders.length) + ' نشط';
        }

        if (activeOrders.length) {
          renderCurrentOrderCard(activeOrders[0]);
          historyOrders = activeOrders.slice(1).concat(historyOrders);
        } else if (currentCard) {
          currentCard.innerHTML =
            '<div class="py-8 text-center text-on-surface-variant">' +
            '<span class="material-symbols-outlined text-primary text-3xl mb-2 block">schedule</span>' +
            '<p class="text-sm">لا يوجد طلبات قيد التنفيذ حالياً.</p>' +
            '</div>';
        }

        renderHistoryList(historyOrders);
      }

      function requestOrders() {
        send('orders-list');
      }

      var navLinks = document.querySelectorAll('nav a');
      var navRoutes = ['/home', '/categories', '/orders', '/cart', '/profile'];
      navLinks.forEach(function (link, index) {
        if (navRoutes[index]) {
          bindLink(link, navRoutes[index]);
        }
      });

      document.addEventListener('click', function (event) {
        var closeModalButton = event.target.closest('[data-close-order-modal="true"]');
        if (closeModalButton) {
          event.preventDefault();
          closeOrderDetails();
          return;
        }

        var orderButton = event.target.closest('[data-order-id]');
        if (orderButton) {
          event.preventDefault();
          var orderId = orderButton.getAttribute('data-order-id');
          var order = findOrderById(orderId);
          if (order) {
            openOrderDetails(order);
          }
          return;
        }

        var cartButton = event.target.closest('[data-go-cart="true"]');
        if (!cartButton) return;
        event.preventDefault();
        send('navigate', { to: '/cart' });
      });

      if (searchInput) {
        searchInput.addEventListener('input', function () {
          renderOrders();
        });
      }

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          closeOrderDetails();
        }
      });

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;
        var payload = event.data;
        if (!payload || payload.source !== 'react-shell') return;

        if (payload.type === 'cart-state') {
          applyStore(payload.store || null);
          state.cartCount = Math.max(0, Number(payload.itemCount) || 0);
          setFooterCartCount(state.cartCount);
          if (state.orders.length) {
            renderOrders();
          }
          return;
        }

        if (payload.type === 'orders-result') {
          if (!payload.success) {
            renderEmptyState();
            alert(payload.message || 'تعذر تحميل الطلبات.');
            return;
          }

          state.orders = Array.isArray(payload.orders) ? payload.orders : [];
          closeOrderDetails();
          renderOrders();
        }
      });

      if (window.AlArnabNotifications && typeof window.AlArnabNotifications.mountHeaderButton === 'function') {
        window.AlArnabNotifications.mountHeaderButton('[data-notification-button]');
      }

      renderEmptyState();
      send('request-state');
      requestOrders();
    })();
  </script>
</body>
</html>
