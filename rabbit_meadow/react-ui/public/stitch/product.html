<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>تفاصيل المنتج - الأرنب</title>
<link rel="stylesheet" href="/stitch/tailwind/product.css" />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&amp;family=Almarai:wght@300;400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Almarai', sans-serif;
            background-color: #FFFFFF;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-shadow {
            box-shadow: 0 10px 30px -5px rgba(26, 54, 93, 0.1);
        }
        .rabbit-logo-font {
            font-family: 'Tajawal', sans-serif;
            font-weight: 900;
            font-style: italic;
        }
    </style>
    <style>
        html,
        body {
          overflow-y: auto;
          scrollbar-width: none;
          -ms-overflow-style: none;
        }

        body::-webkit-scrollbar {
          width: 0;
          height: 0;
        }
      </style>
  <style>
        :root {
          --photo-accent: #0096d6;
          --photo-accent-soft: #cdeefe;
          --photo-text: #1d1d1d;
        }

        body {
          background: #ffffff !important;
          color: var(--photo-text);
        }

        header.fixed {
          width: 100%;
          left: 0;
          top: 0;
          transform: none;
          border-radius: 0;
          border: 0;
          box-shadow: none;
          background: #ffffff;
          padding: 12px 16px;
        }

        header.fixed .w-10,
        header.fixed h1 {
          display: none;
        }

        main.pt-24.pb-64 {
          max-width: 460px;
          padding: 64px 14px 160px;
          margin-inline: auto;
        }

        main .aspect-square.relative {
          border: 0;
          border-radius: 18px;
          box-shadow: none;
          background: #ffffff;
          overflow: hidden;
        }

        main .aspect-square.relative button {
          top: 8px;
          right: 8px;
          border: 0;
          box-shadow: none;
          background: #f6f6f6;
          color: #6b6b6b;
        }

        main .mt-8.px-6.text-center {
          margin-top: 10px;
          padding: 0;
          background: transparent;
          border: 0;
          box-shadow: none;
          text-align: right;
        }

        main h1.font-headline {
          font-size: 1.35rem;
          margin-bottom: 6px;
          color: #171717;
        }

        main p.font-body {
          font-size: 0.9rem;
        }

        .price-summary {
          margin-top: 2px;
          align-items: center;
        }

        .price-badge {
          border: 0;
          background: transparent;
          padding: 0;
        }

        #product-current-price {
          font-size: 1.4rem;
          color: var(--photo-accent);
        }

        .price-before {
          font-size: 0.8rem;
          display: none !important;
        }

        #product-offer-details,
        #product-discount-pill {
          display: none !important;
        }

        .product-action-bar {
          width: 100%;
          border: 0;
          border-radius: 0;
          box-shadow: 0 -8px 22px rgba(0, 0, 0, 0.08);
          background: #ffffff;
          padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
          bottom: 0;
        }

        .product-action-bar > .qty-strip {
          border: 1px solid var(--photo-accent-soft);
          border-radius: 999px;
          background: #fff;
          padding: 4px;
          margin-bottom: 8px;
        }

        .product-action-bar > .qty-strip button:not(#product-qty-value) {
          width: 38px;
          height: 38px;
          border-radius: 999px;
          border: 1px solid #bfe6f9;
          background: #fff;
          color: var(--photo-accent);
        }

        #product-qty-value {
          color: var(--photo-accent);
          font-size: 0.92rem;
          background: transparent;
          border: 0;
          min-width: 52px;
          width: 88px;
          outline: none;
          text-align: center;
        }

        #add-to-cart-button {
          background: var(--photo-accent);
          color: #fff;
          height: 50px;
          border-radius: 10px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding-inline: 14px;
          font-size: 0.86rem;
        }

        #add-to-cart-total {
          font-family: 'Tajawal', sans-serif;
          font-size: 0.88rem;
          font-weight: 800;
        }

        nav.fixed.bottom-0 {
          display: none;
        }
      </style>
  <script src="/stitch/stitch-alert.js"></script>
  <script src="/stitch/stitch-notifications.js"></script>
</head>
<body class="text-on-surface bg-background min-h-screen">
<!-- Top AppBar -->
<header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md flex justify-between items-center px-6 py-4 border-b border-primary/10">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
<h1 class="text-on-surface font-['Tajawal'] font-bold text-2xl tracking-tight">الأرنب</h1>
</div>
<div class="flex items-center gap-2">

<span class="material-symbols-outlined">notifications</span>

</header>
<main class="pt-24 pb-64">

المحل مغلق حالياً، لا يمكن تنفيذ الطلبات الآن.

<!-- Hero Section: Large Product Image -->
<div class="w-full aspect-square relative">
<img alt="طماطم كرزية حمراء" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDf9MJeVFPP9pMzvyD2_1KEauuqKB25Nm9kjENaBe0gJZPdtmkA4uR_Ux4ME62LVKD9T5DxMhicYkmCxgcvCsAJpfcISa6gVzBkUJVdnN6gl6zOO0UcCh90U1pzvF82xfgY6NzMAIjSYXChLOdA-BDw92lnxJz4QSeNZ-TpknjjCL871OSlDEQI4Dpol-H6W9X1C6lUMvT9opoRiCTjeyI-R7tmIaJA24gtrlSBrjVX7WvMbQybSBBm9yb6YE24V3wAWUTIi5s4ECgc"/>
<button class="absolute top-6 right-6 bg-white/80 backdrop-blur-md w-10 h-10 rounded-full flex items-center justify-center text-on-surface active:scale-90 transition-transform shadow-sm">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Product Content -->
<div class="mt-8 px-6 text-center">
<h1 class="font-headline text-4xl font-black text-on-surface tracking-tight">طماطم كرزية حمراء</h1>
<p class="font-body text-on-surface-variant mt-2 text-lg">مزارع القصيم المحلية</p>
<div class="mt-6 price-summary">
<div class="price-badge">
<span id="product-current-price" class="font-headline text-3xl font-bold text-on-surface">4.50 S.P</span>
<span id="product-original-price" class="price-before" style="display:none">5.90 S.P</span>
</div>
<span id="product-discount-pill" class="discount-pill" style="display:none">خصم</span>
</div>
<div id="product-offer-details" class="offer-details" style="display:none">
<div id="product-offer-title" class="offer-details-title">عرض خاص</div>
<p id="product-offer-meta" class="offer-details-meta">قبل: - | بعد: -</p>
</div>
<div class="mt-4">
<label for="product-note-input" class="block text-sm font-bold text-on-surface mb-1">ملاحظة لهذا المنتج</label>
<textarea id="product-note-input" class="w-full min-h-[66px] rounded-xl border border-sky-100 bg-sky-50/40 px-3 py-2 text-sm text-on-surface placeholder:text-slate-400 focus:border-primary focus:ring-0" placeholder="مثال: بدون فليفلة حارة"></textarea>
</div>
</div>
</main>
<!-- Simplified Bottom Bar -->
<div class="product-action-bar fixed flex flex-col z-40">
<!-- Prominent Quantity Selector -->
<div class="qty-strip flex items-center justify-between h-12 w-full">
<button id="product-qty-plus" class="w-9 h-9 bg-white rounded-full flex items-center justify-center text-primary shadow-sm active:scale-90 transition-transform">

</button>
<input id="product-qty-value" type="text" inputmode="decimal" class="font-headline font-bold text-lg text-on-surface px-3" value="1" />
<button id="product-qty-minus" class="w-9 h-9 bg-white rounded-full flex items-center justify-center text-primary shadow-sm active:scale-90 transition-transform">

</button>
</div>
<!-- Large Add to Cart Button -->
<button id="add-to-cart-button" class="w-full bg-primary text-on-primary h-12 rounded-full flex items-center gap-2 font-headline font-bold text-base shadow-lg active:scale-[0.98] transition-all">
<span>أضف إلى السلة</span>
<span id="add-to-cart-total">0 S.P</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-xl flex justify-around items-center px-2 pt-3 pb-6 rounded-t-[3rem] z-50 shadow-[0_-4px_32px_rgba(0,0,0,0.05)]">
<a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-[11px] font-semibold mt-1">الرئيسية</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#87CEEB] text-white rounded-[24px] px-5 py-2" href="#">
<span class="material-symbols-outlined" data-icon="grid_view" data-weight="fill" style="font-variation-settings: 'FILL' 1;">grid_view</span>
<span class="font-label text-[11px] font-semibold mt-1">الأقسام</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label text-[11px] font-semibold mt-1">طلباتي</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
<div class="relative">
<span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
<span class="cart-badge absolute -top-2 -right-2 bg-red-500 text-white text-[9px] min-w-[16px] h-4 px-1 rounded-full border-2 border-white hidden items-center justify-center leading-none">٠</span>
</div>
<span class="font-label text-[11px] font-semibold mt-1">السلة</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label text-[11px] font-semibold mt-1">حسابي</span>
</a>
</nav>
<script>
  (function () {
    var API_BASE =
      window.__AL_ARNAB_API_BASE__ ||
      (function () {
        try {
          return window.localStorage.getItem('al-arnab-api-base') || '';
        } catch (error) {
          return '';
        }
      })() ||
      window.location.origin + '/api';
    var STORAGE_CATEGORY = 'al-arnab-selected-category-id';
    var STORAGE_PRODUCT = 'al-arnab-selected-product-id';
    var ITEM_NOTES_STORAGE_KEY = 'al-arnab-cart-item-notes';
    var heroImage = document.querySelector('main .aspect-square img');
    var titleNode = document.querySelector('main h1.font-headline');
    var subtitleNode = document.querySelector('main p.font-body');
    var currentPriceNode = document.getElementById('product-current-price');
    var originalPriceNode = document.getElementById('product-original-price');
    var discountPillNode = document.getElementById('product-discount-pill');
    var offerDetailsNode = document.getElementById('product-offer-details');
    var offerTitleNode = document.getElementById('product-offer-title');
    var offerMetaNode = document.getElementById('product-offer-meta');
    var qtyNode = document.getElementById('product-qty-value');
    var qtyPlusButton = document.getElementById('product-qty-plus');
    var qtyMinusButton = document.getElementById('product-qty-minus');
    var addButton = document.getElementById('add-to-cart-button');
    var addToCartTotalNode = document.getElementById('add-to-cart-total');
    var noteInput = document.getElementById('product-note-input');
    var storeClosedBanner = document.getElementById('store-closed-banner');
    var state = {
      products: [],
      selectedProductId: '',
      qty: 1,
      cartById: {},
      notesById: loadItemNotes(),
      isStoreOpen: true,
      isAddingItem: false,
      currency: 'SYP',
    };

    function toArabicNumber(value) {
      return String(Math.max(0, Number(value) || 0));
    }

    function normalizeNumberInput(value) {
      var mapped = String(value || '')
        .trim()
        .replace(/[٠-٩]/g, function (digit) {
          return String('٠١٢٣٤٥٦٧٨٩'.indexOf(digit));
        })
        .replace(/،/g, '.')
        .replace(/٫/g, '.')
        .replace(/[^0-9.]/g, '');
      var parsed = Number(mapped);
      return Number.isFinite(parsed) ? parsed : NaN;
    }

    function parseArabicNumber(value) {
      var parsed = normalizeNumberInput(value);
      return Number.isFinite(parsed) ? parsed : 1;
    }

    function isWeightUnit(unit) {
      return String(unit || '').toUpperCase() === 'KG';
    }

    function getSelectedUnit() {
      var product = getSelectedProduct();
      return product && product.unit ? String(product.unit).toUpperCase() : '';
    }

    function qtyStep(unit) {
      return isWeightUnit(unit) ? 0.1 : 1;
    }

    function normalizeQty(value, unit) {
      var parsed = normalizeNumberInput(value);
      if (!Number.isFinite(parsed) || parsed <= 0) {
        return qtyStep(unit);
      }
      if (isWeightUnit(unit)) {
        var rounded = Math.round(parsed * 100) / 100;
        return Math.max(0.1, rounded);
      }
      return Math.max(1, Math.round(parsed));
    }

    function formatQtyForDisplay(value, unit) {
      var numeric = Number(value) || 0;
      if (isWeightUnit(unit)) {
        return numeric.toLocaleString('ar-SA', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
      }
      return numeric.toLocaleString('ar-SA', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }
    function sanitizeNote(value) {
      return String(value || '').trim().slice(0, 400);
    }

    function loadItemNotes() {
      try {
        var raw = window.localStorage.getItem(ITEM_NOTES_STORAGE_KEY) || '{}';
        var parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
          return {};
        }

        var normalized = {};
        Object.keys(parsed).forEach(function (key) {
          var cleanKey = String(key || '').trim();
          var cleanValue = sanitizeNote(parsed[key]);
          if (!cleanKey || !cleanValue) return;
          normalized[cleanKey] = cleanValue;
        });
        return normalized;
      } catch (_error) {
        return {};
      }
    }

    function saveItemNotes() {
      try {
        window.localStorage.setItem(ITEM_NOTES_STORAGE_KEY, JSON.stringify(state.notesById));
      } catch (_error) {
        // Ignore storage errors.
      }
    }

    function syncSelectedNote() {
      if (!noteInput) return;
      var selectedId = String(state.selectedProductId || '');
      noteInput.value = selectedId ? String(state.notesById[selectedId] || '') : '';
    }

    function persistSelectedNote() {
      if (!noteInput) return;
      var selectedId = String(state.selectedProductId || '');
      if (!selectedId) return;

      var cleanNote = sanitizeNote(noteInput.value);
      if (cleanNote) {
        state.notesById[selectedId] = cleanNote;
      } else {
        delete state.notesById[selectedId];
      }
      saveItemNotes();
    }

    function currencyLabel() {
      return 'S.P';
    }

    function applyStore(storePayload) {
      if (!storePayload || typeof storePayload !== 'object') return;
      state.currency = String(storePayload.currency || state.currency || 'SYP').toUpperCase();
      state.isStoreOpen = Boolean(storePayload.isOpen !== false);
    }

    function renderStoreState() {
      if (!storeClosedBanner) return;
      storeClosedBanner.classList.toggle('hidden', state.isStoreOpen);
      if (addButton) {
        addButton.disabled = !state.isStoreOpen || state.isAddingItem;
      }
    }

    function setAddButtonBusy(isBusy) {
      state.isAddingItem = Boolean(isBusy);
      renderStoreState();
    }

    function formatSar(value) {
      return (Math.max(0, Number(value) || 0)).toFixed(2) + ' ' + currencyLabel(state.currency);
    }

    function formatDiscountLabel(product) {
      var discount = product && product.discount ? product.discount : null;
      if (!discount) return 'عرض خاص';

      var type = String(discount.type || '').toUpperCase();
      var value = Math.max(0, Number(discount.value || 0));
      if (type === 'PERCENT') {
        return 'خصم ' + value + '%';
      }

      return 'خصم ' + formatSar(value);
    }

    function renderOfferDetails(product) {
      var finalPrice = Math.max(0, Number(product && product.price ? product.price : 0));
      var originalPrice = Math.max(0, Number(product && product.originalPrice ? product.originalPrice : 0));
      var hasDiscountFlag = Boolean(product && (product.hasDiscount === true || product.hasDiscount === 1 || product.hasDiscount === 'true'));
      var hasPriceDelta = originalPrice > finalPrice && finalPrice > 0;
      var hasOffer = hasDiscountFlag || hasPriceDelta;

      if (currentPriceNode) {
        currentPriceNode.textContent = formatSar(finalPrice);
      }

      if (originalPriceNode) {
        originalPriceNode.style.display = 'none';
        originalPriceNode.textContent = hasPriceDelta ? formatSar(originalPrice) : '';
      }

      if (discountPillNode) {
        if (hasOffer) {
          discountPillNode.style.display = 'inline-flex';
          discountPillNode.textContent = formatDiscountLabel(product);
        } else {
          discountPillNode.style.display = 'none';
          discountPillNode.textContent = '';
        }
      }

      if (!offerDetailsNode || !offerTitleNode || !offerMetaNode) {
        return;
      }

      if (!hasOffer) {
        offerDetailsNode.style.display = 'none';
        offerTitleNode.textContent = 'عرض خاص';
        offerMetaNode.textContent = '';
        return;
      }

      var discount = product && product.discount ? product.discount : null;
      offerDetailsNode.style.display = '';
      offerTitleNode.textContent = discount && discount.title ? discount.title : 'عرض خاص على هذا المنتج';
      offerMetaNode.textContent =
        'السعر قبل الخصم: ' +
        formatSar(originalPrice || finalPrice) +
        '\nالسعر بعد الخصم: ' +
        formatSar(finalPrice);
    }
    function setFooterCartCount(count) {
      var next = Math.max(0, Number(count) || 0);
      var badges = document.querySelectorAll('.cart-badge');
      badges.forEach(function (badge) {
        badge.textContent = toArabicNumber(next);
        badge.style.display = next > 0 ? 'flex' : 'none';
      });
    }

    function getSelectedProductFromRoute() {
      try {
        var path = window.parent && window.parent.location ? window.parent.location.pathname : '';
        var match = String(path || '').match(/\/product\/([^/?#]+)/);
        if (match && match[1]) {
          return decodeURIComponent(match[1]);
        }
      } catch (_error) {
        // Ignore cross-context failures.
      }
      return '';
    }

    function getSelectedProductId() {
      return (
        getSelectedProductFromRoute() ||
        window.localStorage.getItem(STORAGE_PRODUCT) ||
        ''
      );
    }

    function getSelectedProduct() {
      return state.products.find(function (product) {
        return product.id === state.selectedProductId;
      });
    }

    function syncAddToCartTotal() {
      if (!addToCartTotalNode) return;
      var product = getSelectedProduct();
      var unitPrice = Math.max(0, Number(product && product.price ? product.price : 0));
      var unit = getSelectedUnit();
      var qty = normalizeQty(state.qty, unit);
      state.qty = qty;
      addToCartTotalNode.textContent = formatSar(unitPrice * qty);
    }

    function syncQtyNode() {
      if (!qtyNode) return;
      var unit = getSelectedUnit();
      state.qty = normalizeQty(state.qty, unit);
      qtyNode.value = formatQtyForDisplay(state.qty, unit);
      syncAddToCartTotal();
    }

    function renderProductDetails() {
      var product = getSelectedProduct();
      if (!product) {
        if (titleNode) titleNode.textContent = 'منتج غير متوفر';
        if (subtitleNode) subtitleNode.textContent = 'تعذر تحميل تفاصيل المنتج';
        if (currentPriceNode) currentPriceNode.textContent = formatSar(0);
        if (originalPriceNode) originalPriceNode.style.display = 'none';
        if (discountPillNode) discountPillNode.style.display = 'none';
        if (offerDetailsNode) offerDetailsNode.style.display = 'none';
        if (noteInput) noteInput.value = '';
        if (addToCartTotalNode) addToCartTotalNode.textContent = formatSar(0);
        return;
      }

      if (heroImage) {
        heroImage.alt = product.name || 'منتج';
        if (product.imageUrl) {
          heroImage.src = product.imageUrl;
        }
      }

      if (titleNode) titleNode.textContent = product.name || 'منتج';
      if (subtitleNode) {
        subtitleNode.textContent = product.categoryName || product.description || 'منتج طازج من الأرنب';
      }
      renderOfferDetails(product);
      syncSelectedNote();
      syncAddToCartTotal();

      window.localStorage.setItem(STORAGE_PRODUCT, product.id);
      if (product.categoryId) {
        window.localStorage.setItem(STORAGE_CATEGORY, product.categoryId);
      }
    }

    function applyCartState(payload) {
      var items = Array.isArray(payload && payload.items) ? payload.items : [];
      state.cartById = {};
      items.forEach(function (item) {
        var id = String(item && item.id ? item.id : '');
        if (!id) return;
        state.cartById[id] = Math.max(0, Number(item.qty) || 0);
      });

      var selectedQty = Math.max(0, Number(state.cartById[state.selectedProductId]) || 0);
      var unit = getSelectedUnit();
      state.qty = normalizeQty(selectedQty || state.qty || qtyStep(unit), unit);
      syncQtyNode();
      setFooterCartCount(payload && payload.itemCount ? payload.itemCount : 0);
    }

    function send(type, payload) {
      window.parent.postMessage(
        Object.assign({ source: 'stitch-frame', type: type }, payload || {}),
        window.location.origin,
      );
    }

    function bindLink(link, to) {
      if (!link) return;
      link.href = to;
      link.addEventListener('click', function (event) {
        event.preventDefault();
        send('navigate', { to: to });
      });
    }

    var navLinks = document.querySelectorAll('nav a');
    var navRoutes = ['/home', '/categories', '/orders', '/cart', '/profile'];
    navLinks.forEach(function (link, index) {
      if (navRoutes[index]) {
        bindLink(link, navRoutes[index]);
      }
    });

    state.qty = parseArabicNumber(qtyNode ? qtyNode.value : '1');
    if (qtyPlusButton) {
      qtyPlusButton.addEventListener('click', function () {
        var unit = getSelectedUnit();
        state.qty = normalizeQty((Number(state.qty) || 0) + qtyStep(unit), unit);
        syncQtyNode();
      });
    }

    if (qtyMinusButton) {
      qtyMinusButton.addEventListener('click', function () {
        var unit = getSelectedUnit();
        var minimum = qtyStep(unit);
        var nextQty = (Number(state.qty) || minimum) - qtyStep(unit);
        state.qty = normalizeQty(Math.max(minimum, nextQty), unit);
        syncQtyNode();
      });
    }

    if (qtyNode) {
      qtyNode.addEventListener('input', function () {
        var unit = getSelectedUnit();
        var typed = normalizeNumberInput(qtyNode.value);
        if (!Number.isFinite(typed) || typed <= 0) return;
        state.qty = normalizeQty(typed, unit);
        syncAddToCartTotal();
      });

      qtyNode.addEventListener('blur', function () {
        var unit = getSelectedUnit();
        state.qty = normalizeQty(qtyNode.value, unit);
        syncQtyNode();
      });

      qtyNode.addEventListener('keydown', function (event) {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        qtyNode.blur();
      });

      qtyNode.addEventListener('focus', function () {
        qtyNode.select();
      });
    }

    if (addButton) {
      addButton.addEventListener('click', function () {
        if (state.isAddingItem) return;
        if (!state.selectedProductId) {
          if (window.showStitchAlert) {
            window.showStitchAlert('تعذر تحديد المنتج. أعد فتح الصفحة وحاول مرة ثانية.');
          }
          send('request-state');
          return;
        }
        state.qty = normalizeQty(qtyNode ? qtyNode.value : state.qty, getSelectedUnit());
        syncQtyNode();
        if (!state.isStoreOpen) {
          showStitchAlert('المحل مغلق حالياً.');
          return;
        }
        persistSelectedNote();
        setAddButtonBusy(true);
        if (window.showAddToCartFeedback) {
          var selectedProduct = getSelectedProduct();
          var selectedName =
            selectedProduct && selectedProduct.name
              ? String(selectedProduct.name)
              : 'المنتج';
          window.showAddToCartFeedback(addButton, selectedName);
        }
        send('add-item', { id: state.selectedProductId, qty: state.qty });
      });
    }

    if (noteInput) {
      noteInput.addEventListener('input', function () {
        persistSelectedNote();
      });
    }

    var backButton = Array.from(document.querySelectorAll('button')).find(function (button) {
      var icon = button.querySelector('.material-symbols-outlined');
      return icon && icon.textContent.trim() === 'arrow_forward';
    });
    if (backButton) {
      backButton.addEventListener('click', function () {
        send('navigate', { to: '/category-products' });
      });
    }

    window.addEventListener('message', function (event) {
      if (event.origin !== window.location.origin) return;
      var payload = event.data;
      if (!payload || payload.source !== 'react-shell') return;
      if (payload.type === 'add-item-result') {
        setAddButtonBusy(false);
        if (!payload.success) {
          if (window.showStitchAlert) {
            window.showStitchAlert(payload.message || 'تعذر إضافة المنتج إلى السلة.');
          }
          return;
        }
        if (Number.isFinite(Number(payload.itemCount))) {
          setFooterCartCount(Number(payload.itemCount));
        }
        send('request-state');
        return;
      }

      if (payload.type === 'auth-error') {
        setAddButtonBusy(false);
        if (window.showStitchAlert) {
          window.showStitchAlert(payload.message || 'تعذر إتمام العملية.');
        }
        return;
      }

      if (payload.type !== 'cart-state') return;

      applyStore(payload.store || null);
      applyCartState(payload);
      renderProductDetails();
      renderStoreState();
      if (state.isAddingItem) {
        setAddButtonBusy(false);
      }
    });

    fetch(API_BASE + '/catalog/products')
      .then(function (response) {
        if (!response.ok) {
          throw new Error('catalog');
        }
        return response.json();
      })
      .then(function (products) {
        state.products = Array.isArray(products) ? products : [];
        state.selectedProductId = getSelectedProductId();

        var hasSelected = state.products.some(function (product) {
          return product.id === state.selectedProductId;
        });
        if (!hasSelected) {
          state.selectedProductId = (state.products[0] && state.products[0].id) || '';
        }

        renderProductDetails();
        syncQtyNode();
        renderStoreState();
      })
      .catch(function () {
        renderProductDetails();
        renderStoreState();
      });

    if (window.AlArnabNotifications && typeof window.AlArnabNotifications.mountHeaderButton === 'function') {
      window.AlArnabNotifications.mountHeaderButton('[data-notification-button]');
    }

    send('request-state');
  })();
</script>
</body></html>
