<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/stitch/tailwind/profile.css" />
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .inline-edit-btn {
    min-height: 34px;
    padding-inline: 12px;
    border-radius: 9999px;
    white-space: nowrap;
    line-height: 1;
    letter-spacing: 0.1px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    transition:
      background-color 180ms ease,
      color 180ms ease,
      border-color 180ms ease,
      box-shadow 180ms ease,
      transform 180ms ease;
  }
  .inline-edit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(14, 46, 82, 0.12);
  }
  .inline-edit-btn:active {
    transform: translateY(0);
  }
  .inline-edit-btn:disabled {
    transform: none;
    box-shadow: none;
  }
  .inline-edit-btn .material-symbols-outlined {
    font-size: 16px;
    line-height: 1;
    font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20;
  }
  html,
  body {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  html::-webkit-scrollbar,
  body::-webkit-scrollbar {
    width: 0;
    height: 0;
  }
</style>
  <script src="/stitch/stitch-alert.js"></script>
  <script src="/stitch/stitch-notifications.js"></script>
</head>
<body class="bg-surface font-body text-on-surface antialiased pb-32">
  <header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md flex justify-between items-center px-6 py-4 border-b border-primary/10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white shadow-sm">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pets</span>
      </div>
      <h1 class="text-on-surface font-['Tajawal'] font-bold text-2xl tracking-tight">حسابي</h1>
    </div>
    <div class="flex items-center gap-2">
      <button data-notification-button class="text-on-surface-variant hover:text-primary transition-colors" type="button">
        <span class="material-symbols-outlined">notifications</span>
      </button>
      <button id="refresh-profile" class="text-on-surface-variant hover:text-primary transition-colors" type="button">
        <span class="material-symbols-outlined">refresh</span>
      </button>
    </div>
  </header>

  <main class="pt-24 px-4 max-w-2xl mx-auto space-y-6">
    <section class="bg-surface-card border border-primary/10 rounded-3xl p-6 shadow-[0_14px_36px_rgba(26,54,93,0.08)] relative overflow-hidden">
      <div class="absolute -top-12 -left-12 w-36 h-36 bg-primary/20 rounded-full blur-3xl"></div>
      <div class="relative flex items-center gap-3">
        <div id="user-avatar" class="w-14 h-14 rounded-full bg-primary/20 text-primary flex items-center justify-center text-xl font-black">؟</div>
        <div class="min-w-0">
          <h2 id="user-name" class="font-headline font-black text-2xl leading-tight truncate">...</h2>
          <p id="user-welcome" class="text-on-surface-variant text-sm mt-1">جاري تحميل بيانات الحساب</p>
        </div>
      </div>
    </section>

    <section class="space-y-3">
      <div id="name-card" class="bg-surface-card border border-outline rounded-2xl px-4 py-3 transition-colors">
        <div class="flex items-center justify-between gap-3 mb-1">
          <p class="text-on-surface-variant text-xs font-bold">الاسم</p>
          <button
            id="edit-name-btn"
            type="button"
            class="inline-edit-btn inline-flex items-center justify-center gap-1.5 border border-primary/25 bg-primary/5 text-primary text-xs font-bold hover:bg-primary/10"
          >
            <span class="material-symbols-outlined">edit</span>
            <span>تعديل</span>
          </button>
        </div>
        <p id="field-name" class="font-bold text-base">-</p>
        <input id="edit-name" type="text" class="hidden w-full rounded-xl border border-outline px-4 py-3 bg-white text-on-surface focus:ring-2 focus:ring-primary/35 mt-2" placeholder="اكتب الاسم" disabled />
      </div>
      <div id="phone-card" class="bg-surface-card border border-outline rounded-2xl px-4 py-3 transition-colors">
        <div class="flex items-center justify-between gap-3 mb-1">
          <p class="text-on-surface-variant text-xs font-bold">رقم الهاتف</p>
          <button
            id="edit-phone-btn"
            type="button"
            class="inline-edit-btn inline-flex items-center justify-center gap-1.5 border border-primary/25 bg-primary/5 text-primary text-xs font-bold hover:bg-primary/10"
          >
            <span class="material-symbols-outlined">edit</span>
            <span>تعديل</span>
          </button>
        </div>
        <p id="field-phone" class="font-bold text-base" dir="ltr">-</p>
        <input id="edit-phone" dir="ltr" type="tel" class="hidden w-full rounded-xl border border-outline px-4 py-3 bg-white text-on-surface focus:ring-2 focus:ring-primary/35 mt-2" placeholder="09xxxxxxxx" disabled />
      </div>
      <div id="profile-save-actions" class="hidden bg-surface-card border border-outline rounded-2xl p-4 space-y-2">
        <button
          id="save-profile-btn"
          type="button"
          class="w-full flex items-center justify-center gap-2 rounded-full bg-primary text-white font-black py-3 transition hover:opacity-90 active:scale-[0.98]"
        >
          <span class="material-symbols-outlined">save</span>
          <span id="save-profile-label">حفظ التغييرات</span>
        </button>
        <button
          id="cancel-edit-profile-btn"
          type="button"
          class="w-full rounded-full border border-outline text-on-surface-variant font-black py-3 transition hover:opacity-90 active:scale-[0.98]"
        >
          إلغاء
        </button>
        <p id="profile-save-hint" class="text-xs text-on-surface-variant"></p>
      </div>
    </section>

    <section class="bg-surface-card border border-outline rounded-2xl p-4">
      <button id="logout-btn" class="w-full flex items-center justify-center gap-2 rounded-full bg-danger text-white font-black py-3 transition hover:opacity-90 active:scale-[0.98]">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">logout</span>
        <span>تسجيل الخروج</span>
      </button>
    </section>
  </main>

  <nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-xl flex justify-around items-center px-2 pt-3 pb-6 rounded-t-[3rem] z-50 shadow-[0_-4px_32px_rgba(0,0,0,0.05)]">
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <span class="material-symbols-outlined" data-icon="home">home</span>
      <span class="font-label text-[11px] font-semibold mt-1">الرئيسية</span>
    </a>
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <span class="material-symbols-outlined" data-icon="grid_view">grid_view</span>
      <span class="font-label text-[11px] font-semibold mt-1">الأقسام</span>
    </a>
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
      <span class="font-label text-[11px] font-semibold mt-1">طلباتي</span>
    </a>
    <a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:opacity-80 transition-opacity" href="#">
      <div class="relative">
        <span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
        <span class="cart-badge absolute -top-2 -right-2 bg-red-500 text-white text-[9px] min-w-[16px] h-4 px-1 rounded-full border-2 border-white hidden items-center justify-center leading-none">0</span>
      </div>
      <span class="font-label text-[11px] font-semibold mt-1">السلة</span>
    </a>
    <a class="flex flex-col items-center justify-center bg-[#87CEEB] text-white rounded-[24px] px-5 py-2" href="#">
      <span class="material-symbols-outlined" data-icon="person" data-weight="fill" style="font-variation-settings: 'FILL' 1;">person</span>
      <span class="font-label text-[11px] font-semibold mt-1">حسابي</span>
    </a>
  </nav>

<script>
  (function () {
    var state = {
      waitingLogout: false,
      waitingSave: false,
      editingField: null,
      user: null,
      saveTimeoutId: null,
    };

    var notificationsButton = document.querySelector('[data-notification-button]');
    var nameCard = document.getElementById('name-card');
    var phoneCard = document.getElementById('phone-card');
    var fieldNameNode = document.getElementById('field-name');
    var fieldPhoneNode = document.getElementById('field-phone');
    var editNameInput = document.getElementById('edit-name');
    var editPhoneInput = document.getElementById('edit-phone');
    var editNameButton = document.getElementById('edit-name-btn');
    var editPhoneButton = document.getElementById('edit-phone-btn');
    var saveActionsNode = document.getElementById('profile-save-actions');
    var saveButton = document.getElementById('save-profile-btn');
    var saveButtonLabel = document.getElementById('save-profile-label');
    var cancelEditButton = document.getElementById('cancel-edit-profile-btn');
    var saveHintNode = document.getElementById('profile-save-hint');

    function toArabicNumber(value) {
      var map = ['\u0660', '\u0661', '\u0662', '\u0663', '\u0664', '\u0665', '\u0666', '\u0667', '\u0668', '\u0669'];
      return String(value).replace(/[0-9]/g, function (digit) {
        return map[Number(digit)] || digit;
      });
    }

    function setFooterCartCount(count) {
      var next = Math.max(0, Number(count) || 0);
      var badges = document.querySelectorAll('.cart-badge');
      badges.forEach(function (badge) {
        badge.textContent = toArabicNumber(next);
        badge.style.display = next > 0 ? 'flex' : 'none';
      });
    }

    function send(type, payload) {
      window.parent.postMessage(
        Object.assign({ source: 'stitch-frame', type: type }, payload || {}),
        window.location.origin,
      );
    }

    function bindLink(link, to) {
      if (!link) return;
      link.href = to;
      link.addEventListener('click', function (event) {
        event.preventDefault();
        send('navigate', { to: to });
      });
    }

    function userInitial(name) {
      var clean = String(name || '').trim();
      if (!clean) return '؟';
      return clean.charAt(0).toUpperCase();
    }

    function setSaveHint(message, isError) {
      if (!saveHintNode) return;
      saveHintNode.textContent = String(message || '');
      saveHintNode.classList.toggle('text-danger', Boolean(isError));
      saveHintNode.classList.toggle('text-on-surface-variant', !isError);
    }

    function isFieldEditing(field) {
      return state.editingField === field;
    }

    function normalizeNameForInput(name) {
      var clean = String(name || '').trim();
      return clean === 'مستخدم' ? '' : clean;
    }

    function normalizePhoneForInput(phone) {
      var clean = String(phone || '').trim();
      return clean === '-' ? '' : clean;
    }

    function syncFieldButtons() {
      var editingName = isFieldEditing('name');
      var editingPhone = isFieldEditing('phone');

      if (editNameButton) {
        editNameButton.disabled = state.waitingSave;
        editNameButton.classList.toggle('opacity-70', state.waitingSave);
        editNameButton.classList.toggle('cursor-not-allowed', state.waitingSave);
        editNameButton.classList.toggle('bg-primary', editingName);
        editNameButton.classList.toggle('text-white', editingName);
        editNameButton.classList.toggle('border-primary', editingName);
        editNameButton.classList.toggle('bg-primary/5', !editingName);
        editNameButton.classList.toggle('text-primary', !editingName);
        editNameButton.classList.toggle('border-primary/25', !editingName);
        var nameLabel = editNameButton.querySelector('span:last-child');
        if (nameLabel) nameLabel.textContent = editingName ? 'قيد التعديل' : 'تعديل';
      }

      if (editPhoneButton) {
        editPhoneButton.disabled = state.waitingSave;
        editPhoneButton.classList.toggle('opacity-70', state.waitingSave);
        editPhoneButton.classList.toggle('cursor-not-allowed', state.waitingSave);
        editPhoneButton.classList.toggle('bg-primary', editingPhone);
        editPhoneButton.classList.toggle('text-white', editingPhone);
        editPhoneButton.classList.toggle('border-primary', editingPhone);
        editPhoneButton.classList.toggle('bg-primary/5', !editingPhone);
        editPhoneButton.classList.toggle('text-primary', !editingPhone);
        editPhoneButton.classList.toggle('border-primary/25', !editingPhone);
        var phoneLabel = editPhoneButton.querySelector('span:last-child');
        if (phoneLabel) phoneLabel.textContent = editingPhone ? 'قيد التعديل' : 'تعديل';
      }

      if (nameCard) {
        nameCard.classList.toggle('border-primary/40', editingName);
        nameCard.classList.toggle('border-outline', !editingName);
      }

      if (phoneCard) {
        phoneCard.classList.toggle('border-primary/40', editingPhone);
        phoneCard.classList.toggle('border-outline', !editingPhone);
      }

      if (saveActionsNode) {
        saveActionsNode.classList.toggle('hidden', !state.editingField);
      }

      if (saveButton) {
        saveButton.disabled = state.waitingSave;
        saveButton.classList.toggle('opacity-70', state.waitingSave);
        saveButton.classList.toggle('cursor-not-allowed', state.waitingSave);
      }

      if (cancelEditButton) {
        cancelEditButton.disabled = state.waitingSave;
        cancelEditButton.classList.toggle('opacity-70', state.waitingSave);
        cancelEditButton.classList.toggle('cursor-not-allowed', state.waitingSave);
      }

      if (saveButtonLabel) {
        saveButtonLabel.textContent = state.waitingSave ? 'جاري الحفظ...' : 'حفظ التغييرات';
      }
    }

    function setEditingField(field) {
      state.editingField = field === 'name' || field === 'phone' ? field : null;
      var editingName = isFieldEditing('name');
      var editingPhone = isFieldEditing('phone');

      if (fieldNameNode) fieldNameNode.classList.toggle('hidden', editingName);
      if (fieldPhoneNode) fieldPhoneNode.classList.toggle('hidden', editingPhone);

      if (editNameInput) {
        editNameInput.disabled = !editingName;
        editNameInput.classList.toggle('hidden', !editingName);
      }

      if (editPhoneInput) {
        editPhoneInput.disabled = !editingPhone;
        editPhoneInput.classList.toggle('hidden', !editingPhone);
      }

      if (state.user && !state.waitingSave) {
        var baseName = normalizeNameForInput(state.user.name);
        var basePhone = normalizePhoneForInput(state.user.phone);

        if (editingName && editNameInput) editNameInput.value = baseName;
        if (editingPhone && editPhoneInput) editPhoneInput.value = basePhone;
        if (!state.editingField) {
          if (editNameInput) editNameInput.value = baseName;
          if (editPhoneInput) editPhoneInput.value = basePhone;
        }
      }

      syncFieldButtons();
    }

    function setUserData(user) {
      state.user = user && typeof user === 'object'
        ? {
            id: user.id ? String(user.id) : '',
            name: user.name ? String(user.name) : 'مستخدم',
            phone: user.phone ? String(user.phone) : '-',
          }
        : null;

      var name = state.user ? state.user.name : 'مستخدم';
      var phone = state.user ? state.user.phone : '-';

      var title = document.getElementById('user-name');
      var welcome = document.getElementById('user-welcome');
      var avatarNode = document.getElementById('user-avatar');

      if (title) title.textContent = name;
      if (welcome) welcome.textContent = 'مرحباً ' + name + '.';
      if (fieldNameNode) fieldNameNode.textContent = name;
      if (fieldPhoneNode) fieldPhoneNode.textContent = phone;
      if (avatarNode) avatarNode.textContent = userInitial(name);

      if (!state.waitingSave && !state.editingField) {
        if (editNameInput) editNameInput.value = normalizeNameForInput(name);
        if (editPhoneInput) editPhoneInput.value = normalizePhoneForInput(phone);
      }
    }

    function setLogoutLoading(isLoading) {
      state.waitingLogout = Boolean(isLoading);
      var button = document.getElementById('logout-btn');
      if (!button) return;

      button.disabled = state.waitingLogout;
      button.classList.toggle('opacity-70', state.waitingLogout);
      button.classList.toggle('cursor-not-allowed', state.waitingLogout);
      var label = button.querySelector('span:last-child');
      if (label) {
        label.textContent = state.waitingLogout ? 'جاري تسجيل الخروج...' : 'تسجيل الخروج';
      }
    }

    function setSaveLoading(isLoading) {
      state.waitingSave = Boolean(isLoading);
      syncFieldButtons();
    }

    function clearPendingSaveTimeout() {
      if (!state.saveTimeoutId) return;
      window.clearTimeout(state.saveTimeoutId);
      state.saveTimeoutId = null;
    }

    var navLinks = document.querySelectorAll('nav a');
    var navRoutes = ['/home', '/categories', '/orders', '/cart', '/profile'];
    navLinks.forEach(function (link, index) {
      if (navRoutes[index]) {
        bindLink(link, navRoutes[index]);
      }
    });

    if (
      notificationsButton &&
      window.AlArnabNotifications &&
      typeof window.AlArnabNotifications.mountHeaderButton === 'function'
    ) {
      window.AlArnabNotifications.mountHeaderButton(notificationsButton);
    }

    var refreshButton = document.getElementById('refresh-profile');
    if (refreshButton) {
      refreshButton.addEventListener('click', function () {
        send('request-state');
      });
    }

    var logoutButton = document.getElementById('logout-btn');
    if (logoutButton) {
      logoutButton.addEventListener('click', function () {
        if (state.waitingLogout) return;
        setLogoutLoading(true);
        send('logout');
        window.setTimeout(function () {
          setLogoutLoading(false);
        }, 3500);
      });
    }

    function submitProfileChanges() {
      if (!state.editingField) {
        setSaveHint('اختر الحقل الذي تريد تعديله أولاً.', true);
        return;
      }
      if (state.waitingSave) return;
      if (!state.user) {
        showStitchAlert('تعذر قراءة بيانات المستخدم الحالية.');
        return;
      }

      var currentName = normalizeNameForInput(state.user.name);
      var currentPhone = normalizePhoneForInput(state.user.phone);
      var nextName = currentName;
      var nextPhone = currentPhone;

      if (state.editingField === 'name') {
        nextName = String(editNameInput && editNameInput.value ? editNameInput.value : '').trim();
      }

      if (state.editingField === 'phone') {
        nextPhone = String(editPhoneInput && editPhoneInput.value ? editPhoneInput.value : '').trim();
      }

      if (state.editingField === 'name' && !nextName) {
        setSaveHint('الاسم مطلوب.', true);
        showStitchAlert('الاسم مطلوب.');
        return;
      }

      if (state.editingField === 'phone' && !nextPhone) {
        setSaveHint('رقم الهاتف مطلوب.', true);
        showStitchAlert('رقم الهاتف مطلوب.');
        return;
      }

      var changedName = nextName !== currentName;
      var changedPhone = nextPhone !== currentPhone;

      if (!changedName && !changedPhone) {
        setSaveHint('لا توجد تعديلات جديدة لحفظها.', false);
        showStitchAlert('لا توجد تعديلات جديدة لحفظها.');
        return;
      }

      var updatePayload = {};
      if (changedName) updatePayload.name = nextName;
      if (changedPhone) updatePayload.phone = nextPhone;

      setSaveLoading(true);
      setSaveHint('جاري حفظ التعديلات...', false);
      send('profile-update', updatePayload);

      clearPendingSaveTimeout();
      state.saveTimeoutId = window.setTimeout(function () {
        setSaveLoading(false);
        setSaveHint('انتهت مهلة الحفظ. حاول مرة أخرى.', true);
      }, 7000);
    }

    if (editNameButton) {
      editNameButton.addEventListener('click', function () {
        if (state.waitingSave) return;
        setEditingField('name');
        setSaveHint('', false);
        if (editNameInput) {
          editNameInput.focus();
          editNameInput.setSelectionRange(editNameInput.value.length, editNameInput.value.length);
        }
      });
    }

    if (editPhoneButton) {
      editPhoneButton.addEventListener('click', function () {
        if (state.waitingSave) return;
        setEditingField('phone');
        setSaveHint('', false);
        if (editPhoneInput) {
          editPhoneInput.focus();
          editPhoneInput.setSelectionRange(editPhoneInput.value.length, editPhoneInput.value.length);
        }
      });
    }

    if (saveButton) {
      saveButton.addEventListener('click', function () {
        submitProfileChanges();
      });
    }

    if (cancelEditButton) {
      cancelEditButton.addEventListener('click', function () {
        if (state.waitingSave) return;
        setEditingField(null);
        setSaveHint('تم إلغاء وضع التعديل.', false);
      });
    }

    window.addEventListener('message', function (event) {
      if (event.origin !== window.location.origin) return;
      var payload = event.data;
      if (!payload || payload.source !== 'react-shell') return;

      if (payload.type === 'cart-state') {
        setFooterCartCount(payload.itemCount || 0);
        setUserData(payload.user || null);
        setLogoutLoading(false);
        return;
      }

      if (payload.type === 'profile-update-result') {
        clearPendingSaveTimeout();
        setSaveLoading(false);

        if (!payload.success) {
          setSaveHint(payload.message || 'تعذر حفظ التعديلات.', true);
          showStitchAlert(payload.message || 'تعذر حفظ التعديلات.', { tone: 'error', icon: '!' });
          return;
        }

        setUserData(payload.user || state.user);
        setEditingField(null);
        setSaveHint('تم حفظ التعديلات بنجاح.', false);
        showStitchAlert('تم تحديث بيانات الحساب بنجاح.', { tone: 'success', icon: 'OK' });
        return;
      }

      if (payload.type === 'auth-error') {
        clearPendingSaveTimeout();
        setSaveLoading(false);
        setLogoutLoading(false);
        setSaveHint(payload.message || 'تعذر إتمام العملية.', true);
        alert(payload.message || 'تعذر إتمام العملية.');
      }
    });

    if (
      window.AlArnabNotifications &&
      typeof window.AlArnabNotifications.tryBindForegroundMessages === 'function'
    ) {
      window.AlArnabNotifications.tryBindForegroundMessages();
    }

    setEditingField(null);
    send('request-state');
  })();
</script>
</body>
</html>
