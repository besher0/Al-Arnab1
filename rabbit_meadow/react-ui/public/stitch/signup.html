<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب | الأرنب</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Almarai:wght@300;400;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
<link rel="stylesheet" href="/stitch/tailwind/signup.css" />
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      }

      html,
      body {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      body {
        font-family: 'Almarai', sans-serif;
      }

      .signup-content {
        width: min(100%, 34rem);
        display: grid;
        gap: clamp(0.75rem, 1.9vh, 1.15rem);
      }

      .signup-header {
        margin-bottom: clamp(0.5rem, 1.6vh, 1rem);
      }

      @media (max-height: 760px) {
        .signup-content {
          gap: 0.55rem;
        }

        .signup-header {
          margin-bottom: 0.35rem;
        }

        .signup-card {
          padding-top: 0.95rem;
          padding-bottom: 0.95rem;
        }

        .signup-form {
          margin-top: 0.65rem;
          gap: 0.65rem;
        }
      }
    </style>
    <script src="/stitch/stitch-alert.js"></script>
</head>
  <body class="min-h-screen overflow-hidden bg-background text-ink">
    <div class="pointer-events-none fixed inset-0">
      <div class="absolute -top-24 -right-24 h-72 w-72 rounded-full bg-primary/25 blur-3xl"></div>
      <div class="absolute -bottom-24 -left-24 h-72 w-72 rounded-full bg-secondary/20 blur-3xl"></div>
    </div>

    <main class="relative z-10 mx-auto flex min-h-screen w-full items-center justify-center px-3 py-2 sm:px-5 sm:py-4">
      <div class="signup-content">
        <section class="signup-header text-center">
          <div class="mx-auto mb-2 flex h-14 w-14 items-center justify-center rounded-3xl bg-white/90 shadow-lg shadow-primary/20 sm:h-16 sm:w-16">
            <img src="/stitch/assets/arnab-logo.jpg" alt="الأرنب للتسوق" class="h-full w-full rounded-3xl object-cover" />
          </div>
          <h1 class="font-headline text-[clamp(1.8rem,5vw,2.2rem)] font-black tracking-tight text-primary">الأرنب</h1>
          <p class="mt-1 break-words text-[13px] font-semibold leading-5 text-muted sm:text-sm">أنشئ حسابك وابدأ التسوق</p>
        </section>

        <section class="signup-card rounded-3xl border border-white/60 bg-surface/90 p-4 shadow-card backdrop-blur sm:p-5">
          <h2 class="font-headline text-xl font-extrabold text-ink sm:text-2xl">إنشاء حساب</h2>

          <form id="signup-form" class="signup-form mt-3 space-y-3.5" novalidate autocomplete="off">
            <label class="block space-y-1.5">
              <span class="block pr-1 text-[13px] font-bold text-muted sm:text-sm">الاسم الكامل</span>
              <div class="relative">
                <span class="material-symbols-outlined pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-primary">person</span>
                <input
                  id="signup-name-input"
                  type="text"
                  autocomplete="off"
                  name="signup_name_input"
                  placeholder="أدخل اسمك الكامل"
                  class="h-11 w-full rounded-2xl border-0 bg-slate-50 pr-12 pl-4 text-sm font-semibold text-ink placeholder:text-slate-400 focus:ring-2 focus:ring-primary/35"
                />
              </div>
            </label>

            <label class="block space-y-1.5">
              <span class="block pr-1 text-[13px] font-bold text-muted sm:text-sm">رقم الهاتف</span>
              <div class="relative">
                <span class="material-symbols-outlined pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-primary">call</span>
                <input
                  id="signup-phone-input"
                  type="tel"
                  dir="ltr"
                  autocomplete="off"
                  inputmode="numeric"
                  name="signup_phone_input"
                  placeholder="09********"
                  class="h-11 w-full rounded-2xl border-0 bg-slate-50 pr-12 pl-4 text-sm font-semibold text-ink placeholder:text-slate-400 focus:ring-2 focus:ring-primary/35"
                />
              </div>
            </label>

            <label class="block space-y-1.5">
              <span class="block pr-1 text-[13px] font-bold text-muted sm:text-sm">كلمة المرور</span>
              <div class="relative">
                <span class="material-symbols-outlined pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-primary">lock</span>
                <input
                  id="signup-password-input"
                  type="password"
                  autocomplete="new-password"
                  name="signup_password_input"
                  placeholder="********"
                  class="h-11 w-full rounded-2xl border-0 bg-slate-50 pr-12 pl-12 text-sm font-semibold text-ink placeholder:text-slate-400 focus:ring-2 focus:ring-primary/35"
                />
                <button
                  class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 transition hover:text-primary"
                  type="button"
                  data-password-toggle="signup-password-input"
                  aria-label="إظهار أو إخفاء كلمة المرور"
                >
                  <span class="material-symbols-outlined text-base">visibility</span>
                </button>
              </div>
            </label>

            <label class="block space-y-1.5">
              <span class="block pr-1 text-[13px] font-bold text-muted sm:text-sm">تأكيد كلمة المرور</span>
              <div class="relative">
                <span class="material-symbols-outlined pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-primary">verified_user</span>
                <input
                  id="signup-confirm-password-input"
                  type="password"
                  autocomplete="new-password"
                  name="signup_confirm_password_input"
                  placeholder="********"
                  class="h-11 w-full rounded-2xl border-0 bg-slate-50 pr-12 pl-12 text-sm font-semibold text-ink placeholder:text-slate-400 focus:ring-2 focus:ring-primary/35"
                />
                <button
                  class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 transition hover:text-primary"
                  type="button"
                  data-password-toggle="signup-confirm-password-input"
                  aria-label="إظهار أو إخفاء كلمة المرور"
                >
                  <span class="material-symbols-outlined text-base">visibility</span>
                </button>
              </div>
            </label>

            <button
              type="submit"
              class="mt-1 inline-flex h-11 w-full items-center justify-center gap-2 rounded-2xl bg-primary font-headline text-base font-extrabold text-white shadow-lg shadow-primary/25 transition hover:brightness-95 active:scale-[0.99]"
            >
              <span>إنشاء الحساب</span>
              <span class="material-symbols-outlined text-lg">arrow_back</span>
            </button>
          </form>

          <p class="mt-3 break-words text-center text-[13px] leading-5 text-muted sm:text-sm">
            لديك حساب بالفعل؟
            <a id="login-link" href="/login" class="font-extrabold text-primary hover:underline">تسجيل الدخول</a>
          </p>
        </section>
      </div>
    </main>

    <script>
      (function () {
        function send(type, payload) {
          window.parent.postMessage(
            Object.assign({ source: 'stitch-frame', type: type }, payload || {}),
            window.location.origin,
          )
        }

        var loginLink = document.getElementById('login-link')
        if (loginLink) {
          loginLink.addEventListener('click', function (event) {
            event.preventDefault()
            send('navigate', { to: '/login' })
          })
        }

        var form = document.getElementById('signup-form')
        if (!form) return

        var nameField = document.getElementById('signup-name-input')
        var phoneField = document.getElementById('signup-phone-input')
        var passwordField = document.getElementById('signup-password-input')
        var confirmPasswordField = document.getElementById('signup-confirm-password-input')

        function syncPlaceholdersAndReset() {
          if (phoneField) {
            phoneField.setAttribute('placeholder', '09********')
            phoneField.value = ''
          }
          if (passwordField) {
            passwordField.setAttribute('placeholder', '********')
            passwordField.value = ''
          }
          if (confirmPasswordField) {
            confirmPasswordField.setAttribute('placeholder', '********')
            confirmPasswordField.value = ''
          }
          if (nameField) {
            nameField.value = ''
          }
        }

        syncPlaceholdersAndReset()
        window.setTimeout(syncPlaceholdersAndReset, 120)
        window.setTimeout(syncPlaceholdersAndReset, 420)
        window.addEventListener('pageshow', syncPlaceholdersAndReset)

        var toggleButtons = document.querySelectorAll('[data-password-toggle]')
        toggleButtons.forEach(function (button) {
          button.addEventListener('click', function () {
            var inputId = button.getAttribute('data-password-toggle')
            if (!inputId) return

            var targetInput = document.getElementById(inputId)
            if (!targetInput) return

            var isPassword = targetInput.type === 'password'
            targetInput.type = isPassword ? 'text' : 'password'

            var icon = button.querySelector('.material-symbols-outlined')
            if (icon) {
              icon.textContent = isPassword ? 'visibility_off' : 'visibility'
            }
          })
        })

        form.addEventListener('submit', function (event) {
          event.preventDefault()

          var nameInput = document.getElementById('signup-name-input')
          var phoneInput = document.getElementById('signup-phone-input')
          var passwordInput = document.getElementById('signup-password-input')
          var confirmPasswordInput = document.getElementById('signup-confirm-password-input')

          var name = (nameInput && nameInput.value ? nameInput.value : '').trim()
          var phone = (phoneInput && phoneInput.value ? phoneInput.value : '').trim()
          var password = (passwordInput && passwordInput.value ? passwordInput.value : '').trim()
          var confirmPassword = (confirmPasswordInput && confirmPasswordInput.value ? confirmPasswordInput.value : '').trim()

          if (!name) {
            alert('الاسم مطلوب.')
            return
          }

          if (!phone) {
            alert('رقم الهاتف مطلوب.')
            return
          }

          if (phone.length < 6 || phone.length > 20) {
            alert('رقم الهاتف يجب أن يكون بين 6 و20 خانة.')
            return
          }

          if (!password || !confirmPassword) {
            alert('يرجى إدخال كلمة المرور وتأكيدها.')
            return
          }

          if (password !== confirmPassword) {
            alert('كلمتا المرور غير متطابقتين.')
            return
          }

          send('auth-register', {
            name: name,
            phone: phone,
          })
        })

        window.addEventListener('message', function (event) {
          if (event.origin !== window.location.origin) return

          var payload = event.data
          if (!payload || payload.source !== 'react-shell') return
          if (payload.type !== 'auth-error') return

          alert(payload.message || 'تعذر إنشاء الحساب.')
        })
      })()
    </script>
  </body>
</html>
